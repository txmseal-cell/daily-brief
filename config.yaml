# daily-brief 配置文件
# 所有 API Key 从环境变量读取，不硬编码

# ============================================================
# LLM 配置：MiniMax 主用，DeepSeek 备用
# 用户 MiniMax 账户每月有免费额度，主用消耗免费 token
# 日常抓取不调 AI，AI 只在 Cloudflare Functions 按需调用
# 这里只给配置参考，实际调用在 functions/api/*.js 里
# ============================================================
llm:
  primary:
    provider: minimax
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    model: MiniMax-Text-01
  fallback:
    provider: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-chat

# ============================================================
# 分类优先级（数字越小越靠前）
# ============================================================
categories:
  priority:
    - 农业
    - 经济
    - 金融
    - 科技
    - 政治
    - 军事
    - 娱乐
    - 社会

# ============================================================
# 热度计算规则
# 热度 = 跨来源次数 × 来源权重 × 分类权重
# max_translate_per_day 限制每天 Function 翻译免费额度
# ============================================================
hot_rules:
  cross_source: 3            # 跨来源阈值
  cross_source_days: 7
  source_weight:
    Reuters: 10
    BBC: 10
    "Al Jazeera": 9
    AP: 9
    NPR: 8
    DW: 8
    "France 24": 8
    "The Guardian": 8
    FAO: 9
    USDA: 9
    IMF: 9
    "World Bank": 8
    OECD: 8
    BIS: 8
    NBER: 7
    Bloomberg: 10
    CNBC: 8
    MarketWatch: 7
    "Yahoo Finance": 7
    "Seeking Alpha": 6
    华尔街见闻: 8
    财联社: 8
    雪球: 7
    "36氪": 7
    "Proplanta": 8
    agrarzeitung: 7
    OilPrice: 8
    "S&P Global": 8
    ICRISAT: 7
    IWMI: 7
    IFPRI: 7
    arXiv: 8
    Nature: 9
    "OpenAI Blog": 9
    Anthropic: 9
    "Google DeepMind": 9
    "Hugging Face": 8
    TechCrunch: 8
    "MIT Technology Review": 8
    "The Verge": 7
    "Hacker News": 7
    "IT之家": 7
    Solidot: 7
    "Defense.gov": 7
    C4ISRNet: 7
    "War on the Rocks": 7
    V2EX: 6
    掘金: 6
    集思录: 6
    知乎热榜: 6
  category_weight:
    农业: 10
    经济: 9
    金融: 9
    科技: 8
    政治: 7
    军事: 6
    娱乐: 3
    社会: 3
  max_translate_per_day: 5

# ============================================================
# 议题识别规则
# ============================================================
topics:
  cross_source_threshold: 3
  cross_source_days: 7
  single_source_threshold: 3
  single_source_days: 30
  pending_archive_days: 30

# ============================================================
# 手动主题（你主动追踪的长期主题）
# 命中关键词的事实自动归到对应主题
# ============================================================
manual_topics:
  - name: 小麦
    keywords: [小麦, wheat, 粮食, 出口限制, 俄罗斯, 乌克兰, 印度]
  - name: 化肥
    keywords: [化肥, fertilizer, 天然气, 尿素, urea, 钾肥, potash]
  - name: AI_Agent
    keywords: [AI agent, 智能体, agentic, MCP, Anthropic, OpenAI agent]
  - name: 半导体
    keywords: [半导体, GPU, NVIDIA, 台积电, TSMC, H100, B200, ASML, 出口管制]

