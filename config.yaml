# ============================================================
# 抓取参数
# ============================================================
fetch:
  per_source_limit_default: 2     # 默认每源头条数（源自身 max_items 优先）
  max_age_hours: 30               # 只看最近 N 小时
  user_agent: "daily-brief/1.0 (+https://github.com)"
  timeout_seconds: 15             # 单个源超时
  og_image_timeout: 8             # 抓 og:image 超时

# ============================================================
# Functions 配置（仅参考，实际在 functions/api/*.js）
# ============================================================
functions:
  rate_limit_per_ip_per_minute: 20
  max_input_length: 5000
  enable_fallback: true
