leriya Tkachenko was dropping her son off at school in central Kyiv when the air raid alert sounded. Staff hurried the children and parents into the shelter, where the frightened lawyer spent the next two hours with her son. “I’m scared to death all day about what could happen to my son,” she said as she emerged from the shelter, already late for work. Continue reading...", "source": "The Guardian", "category": "科技", "date": "2026-10-03", "url": "https://www.theguardian.com/world/2026/oct/02/terror-kyiv-russia-ramps-up-attacks-ukraine"}, {"id": "F20261003-022", "title": "Ford fends off Hyundai to retain No. 3 U.S. sales position in third quarter", "summary": "Ford on Friday reported a year-over-year sales decline of 6.6% during the third quarter to 507,395 light-duty vehicles.", "source": "CNBC", "category": "科技", "date": "2026-10-03", "url": "https://www.cnbc.com/2026/10/02/ford-q3-sales.html"}, {"id": "F20261003-023", "title": "FAA says Boeing 737 Max software glitch not a flight-safety issue", "summary": "The FAA on Monday said it was reviewing the software glitch, which could affect procedures during certain landings.", "source": "CNBC", "category": "科技", "date": "2026-10-03", "url": "https://www.cnbc.com/2026/10/02/faa-says-boeing-737-max-10-software-glitch-not-a-flight-safety-issue.html"}, {"id": "F20261003-028", "title": "Trump Says South Korea Deal Includes $8.4 Billion U.S. Oil Project", "summary": "President Donald Trump said Friday that South Korea’s investment agreement with the United States now includes $8.4 billion for an enhanced oil recovery project. Seoul says it agreed to no such thing. “The Republic of Korea Deal keeps getting BETTER! 8.4 Billion Dollars for an enhanced Oil Recovery Project. Producing more Oil and Gas means American Energy Dominance and Energy Security in the World for the Future!” Trump wrote on Truth Social. Enhanced oil recovery (EOR) is used to squeeze more production from aging fields after…", "source": "OilPrice", "category": "科技", "date": "2026-10-03", "url": "https://oilprice.com/Latest-Energy-News/World-News/Trump-Says-South-Korea-Deal-Includes-84-Billion-US-Oil-Project.html"}, {"id": "F20261003-037", "title": "Open-sourcing AstaBrief, the fast report-generation model in Asta", "summary": "", "source": "Hugging Face", "category": "科技", "date": "2026-10-03", "url": "https://huggingface.co/blog/allenai/astabrief"}, {"id": "F20261003-038", "title": "AutoSynthData: Generating Training Data for Enterprise Agents", "summary": "", "source": "Hugging Face", "category": "科技", "date": "2026-10-03", "url": "https://huggingface.co/blog/ServiceNow-AI/autosynthdata"}, {"id": "F20261003-039", "title": "Meta wants your next gadget to be Muse-infused", "summary": "Meta wants Muse in your TV and your toaster, so it's giving the code away for free.", "source": "TechCrunch", "category": "科技", "date": "2026-10-03", "url": "https://techcrunch.com/2026/10/02/meta-wants-you-to-build-your-own-muse-gadget/"}, {"id": "F20261003-024", "title": "‘I don’t want to die on the sales floor’: I’m 67 and earn $19.50 an hour at a big-box store. When can I finally retire?", "summary": "“I started taking Social Security at 66 and receive $2,410 a month. I have $214,000 in my 401(k).”", "source": "MarketWatch", "category": "金融", "date": "2026-10-03", "url": "https://www.marketwatch.com/story/i-dont-want-to-die-on-the-sales-floor-im-67-and-earn-19-50-an-hour-at-a-big-box-store-when-can-i-finally-retire-369abcf9?mod=mw_rss_topstories"}, {"id": "F20261003-016", "title": "An LLM Workflow That Reproduces, Improves, and Extends Published Economics Research -- by Matthew Schwartz, Isaiah Andrews, Jesse M. Shapiro", "summary": "We introduce an open-source workflow that enables an LLM to reproduce, improve, and extend an economics article using the article’s published replication package. First, the workflow attempts to reproduce the original calculations, checks for discrepancies with published findings, and performs automated sensitivity analysis. Across 4,452 published replication packages for five economics journals, the workflow flags discrepancies in 3,460 articles or their appendices. Second, the workflow improves the original calculations by using a different implementation or algorithm. In 496 articles, the w", "source": "NBER", "category": "科技", "date": "2026-10-03", "url": "https://www.nber.org/papers/w35782#fromrss"}, {"id": "F20261003-017", "title": "(How) Do We Teach Emotions? -- by Anjali Adukia, Matthew Bonci, Paula Dastres Gallardo, Emileigh Harrison, Jake Nicoll, Teodora Szasz", "summary": "Emotional intelligence constitutes a key component of human capital, shaped partially by educational materials. Using machine learning and generative AI tools, we examine emotional content in public-school textbooks and children’s literature. A stark mismatch emerges: text exposes children to a broad emotional range, but images overwhelmingly depict happiness and calm, regardless of emotions described in text on the same page. Nearly half of pages show zero overlap between the emotions described in text and those shown in images. This pattern persists across time, contexts, and identities. Hou", "source": "NBER", "category": "科技", "date": "2026-10-03", "url": "https://www.nber.org/papers/w35789#fromrss"}, {"id": "F20261003-025", "title": "Why Western Digital and Seagate are seeing big stock drops today", "summary": "Investors are worried that Toshiba will boost its production of a key AI storage product, potentially hurting the strong pricing power that Western Digital and Seagate currently enjoy.", "source": "MarketWatch", "category": "科技", "date": "2026-10-03", "url": "https://www.marketwatch.com/story/why-western-digital-and-seagate-are-seeing-big-stock-drops-today-6b16d95e?mod=mw_rss_topstories"}, {"id": "F20261003-045", "title": "Meta open sources code to let you make Muse AI gadgets", "summary": "Meta now lets you make your own Muse gadgets that feature the company's new AI agent with code that the company open sourced. The company suggests projects like loading Muse on a color E Ink display to show reminders, adding it to an HDMI stick so you can display Muse on a big screen, or […]", "source": "The Verge", "category": "科技", "date": "2026-10-03", "url": "https://www.theverge.com/tech/1004330/meta-muse-ai-gadgets-home-link"}, {"id": "F20261003-046", "title": "Netflix is pivoting away from prestige", "summary": "Many of Netflix's biggest critically acclaimed hits have been the products of its multiyear production deals with noted directors like David Fincher and Shawn Levy. In the past few weeks, though, the streamer has brought some of those partnerships to an end in a way that feels indicative of a larger strategic shift. With rival […]", "source": "The Verge", "category": "科技", "date": "2026-10-03", "url": "https://www.theverge.com/streaming/1004323/netflix-david-fincher-shawn-levy-mike-flanagan-duffer-brothers-greta-gerwig"}, {"id": "F20261003-047", "title": "Things That Apparently Cause Cancer", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://www.breakthroughjournal.org/p/things-that-apparently-cause-cancer"}, {"id": "F20261003-048", "title": "The Forgetful CPU (Linux on M4)", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://yuka.dev/blog-2026-10-02-linux-m4.html"}, {"id": "F20261003-049", "title": "自身股价下跌，安森美将收购 Synaptics 的对价调整为 57 亿美元现金", "summary": "IT之家 10 月 3 日消息，onsemi（安森美）美国当地时间 1 日宣布，已就修改今年 6 月 25 日公布的合并协议与 Synaptics（新突思）达成一致。 安森美将以约 57 亿美元 （IT之家注：现汇率约合 382.72 亿元人民币） 的现金 完成该笔交易 ，而不是此前公布的 70 亿美元股票，这对应 18.6% 的折让。 IT之家注意到，安森美公布收购交易同日收盘价为 118.74 美元、后一日开盘价为 98.29 美元。而安森美当前股价在 85 美元上下， 对比此前数据分别下跌了 28.4% 和 13.5% 。 安森美表示此次修订是由于 收到第三方主动提出的竞争性收购方案 ，预计此次交易将立即提升其 Non-GAAP 每股收益，并为 Synaptics 的股东带来价值确定性。 该交易预计仍将于 2027 年中期完成 ，但需获得 Synaptics 股东的批准、必要的监管机构批准以及满足其他惯例成交条件。该交易已获得美国联邦贸易委员会的批准，其他司法管辖区的监管机构正在审查该交易。 相关阅读： 《 安森美将换股收购边缘 AI 芯片企业 Synaptics，交易价值 70 亿美元 》", "source": "IT之家", "category": "科技", "date": "2026-10-03", "url": "https://www.ithome.com/1/009/410.htm"}, {"id": "F20261003-051", "title": "French Air Force plans loyal wingman flight in 2028 in sovereign AI push", "summary": "The French Air Force plans to fly crewed fighter jets in collaboration with AI-powered combat drones in 2028, under project Hypairion.", "source": "C4ISRNet", "category": "科技", "date": "2026-10-03", "url": "https://www.c4isrnet.com/global/europe/2026/10/02/french-air-force-plans-loyal-wingman-flight-in-2028-in-sovereign-ai-push/"}, {"id": "F20261003-052", "title": "How Closed Airspace Threatens U.S. Military Mobility Across Eurasia", "summary": "For much of the modern aviation era, geography was something the global aviation industry learned to overcome. Simply put, unlike a railway, a pipeline, or a highway, an aircraft does not require a continuous physical infrastructure between its point of departure and its destination. Routes could change, aircraft could move between markets, and hubs could rise and decline. If economics justified a service, aviation possessed an extraordinary ability to find another way through. Before 2022, for nearly a decade at Russian AirBridgeCargo Airlines, I watched that principle operate from inside one", "source": "War on the Rocks", "category": "科技", "date": "2026-10-03", "url": "https://warontherocks.com/how-closed-airspace-threatens-u-s-military-mobility-across-eurasia/"}, {"id": "F20261003-026", "title": "Riley Exploration Permian: Significant FCF Generation Expected In H2 2026", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951714-riley-exploration-permian-significant-fcf-generation-expected-in-2h-2026?source=feed_all_articles"}, {"id": "F20261003-027", "title": "Ardent Health Passed Its Health Check", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951712-ardent-health-passed-its-health-check?source=feed_all_articles"}, {"id": "F20261003-001", "title": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat", "summary": "The co-ordinated release is aimed at heading off further price spikes and avoiding a ban on US diesel exports.", "source": "BBC World", "category": "农业", "date": "2026-10-03", "url": "https://www.bbc.co.uk/news/articles/ck87zg8jnwngo?at_medium=RSS&at_campaign=rss"}, {"id": "F20261003-031", "title": "When Do Causal World Models Help Modular LLM Agents", "summary": "arXiv:2610.00012v1 Announce Type: new Abstract: LLM agents increasingly act through modular systems, such as order, payment, inventory, and shipment services, where actions in one module change which transitions are valid in another. Standard world models usually fit observational traces, but this is not the quantity needed for intervention-time planning: a trace may show that payment precedes shipment without identifying whether payment authorizes shipment, inventory mediates the effect, or a hidden trigger explains both. We study this gap through FedCausalCompose, a causal world-model framew", "source": "arXiv cs.AI", "category": "金融", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00012"}, {"id": "F20261003-002", "title": "US murderer Christa Pike unconscious and on ventilator after failed execution, lawyers say", "summary": "As of Thursday night, Pike remained critically ill and is being treated at a hospital in Nashville, Tennessee.", "source": "BBC World", "category": "科技", "date": "2026-10-03", "url": "https://www.bbc.co.uk/news/articles/c3kgqw7zvz47o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261003-030", "title": "Heavy-Tailed Memory Traces in Long-Horizon Language Agents", "summary": "arXiv:2610.00010v1 Announce Type: new Abstract: Long-horizon language agents increasingly rely on external memory as a frozen world model, yet current memory systems are usually judged only by task success or token cost. We argue that the missing object is the shape of memory use: under finite context and repeated retrieval, agent memory can concentrate on a small core while leaving rare states in a long tail where prediction errors accumulate. We study this effect through a conservative tail audit and find that concentration is reproducible but policy-dependent. Random-walk agents produce log", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00010"}, {"id": "F20261003-032", "title": "From Proposal to Verified Effect: Praxa, an Evidence-Bound Harness for Governed AI Agent Execution", "summary": "arXiv:2610.00015v1 Announce Type: new Abstract: Large-language-model agents can propose and execute actions, but proposal, authority, dispatch, verified external effect, and serving promotion are different claims. We present Praxa, an agent harness that represents these states explicitly through deterministic admission, brokered execution, external read-back, reconciliation, and reviewed promotion. We report four evidence lanes. First, an author-run repository-local audit at a pinned revision passed 1,027/1,027 unit tests and 89/89 Workerd tests, instrumented all 363 expected source files, and", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00015"}, {"id": "F20261003-041", "title": "Apple changes full-disk access permissions to curb abuse from AI agents", "summary": "Meta says FDA isn't sufficient to Muse reading messages. Apple begs to differ.", "source": "Ars Technica", "category": "科技", "date": "2026-10-03", "url": "https://arstechnica.com/security/2026/10/apple-changes-full-disk-access-permissions-to-curb-abuse-from-ai-agents/"}, {"id": "F20261003-042", "title": "Someone got Doom in an SQL database", "summary": "1,300 lines of SQL querying renders accurate bitmapped views of Hell at 35 fps.", "source": "Ars Technica", "category": "科技", "date": "2026 ubai flight 1073 heralded, eye witnesses report seeing the co-pilot trying to kill the pilot and destroying the cockpit controls in order to crash the plane. Despite being stabbed repeatedly, Captan Smit Machchhar managed to open the cockpit door, allowing passengers to overwhelm the suspect and regain control of the aircraft after its rapid descent of more than 14,000 feet in 30 seconds. They prevented a 9/11-style catastrophe, Israeli Prime Minister Benjamin Netanyahu said.", "source": "France 24", "category": "科技", "date": "2026-10-03", "url": "https://www.france24.com/en/tv-shows/the-debate/20261003-barricades-the-blame-game-the-french-school-protests"}, {"id": "F20261003-023", "title": "These companies look set to face high-profile hearings and other scrutiny if Democrats win the House", "summary": "Law and lobbying firms in Washington, D.C., are telling companies to prepare for a new level of scrutiny, since most modern midterm elections result in some loss of congressional control for the party that holds the White House.", "source": "MarketWatch", "category": "金融", "date": "2026-10-03", "url": "https://www.marketwatch.com/story/these-companies-look-set-to-face-high-profile-hearings-and-other-scrutiny-if-democrats-win-the-house-513fe8e7?mod=mw_rss_topstories"}, {"id": "F20261003-039", "title": "An AI agent emailed researchers for help. It told us why", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://www.science.org/content/article/exclusive-ai-agent-emailed-hundreds-researchers-help-it-told-us-why"}, {"id": "F20261003-041", "title": "开发者为经典 FPS《泰坦陨落 2》单人战役模式推出免费 VR 模组：支持体感操作武器换弹", "summary": "IT之家 10 月 3 日消息，模组作者 CircuitLord 宣布为经典 FPS 游戏《泰坦陨落 2》推出一款免费 VR 模组，为游戏加入头部追踪、武器瞄准、机甲武器控制以及手动换弹等功能，玩家可以通过 CircuitLord 制作的 Mod 安装器进行快速安装。 除了头部追踪和 VR 武器瞄准外，玩家还可以利用手部控制器直接操作机甲武器，并使用体感手势动作为部分武器进行换弹，以取得更加沉浸式的效果。 CircuitLord 同时表示，《泰坦陨落 2》本身就是以高速移动著称的 FPS，因此 VR 版本对于玩家的适应能力要求更高。游戏中的跑墙、空中移动以及利用抓钩高速穿越战场等操作，会产生比传统平面屏幕游戏更加明显的视角变化， 可能导致部分玩家因此出现晕动情况，相应玩家可以单独开启模组的“辅助移动”功能，以降低不适情况 。 不过，目前这款 VR Mod 仅支持《泰坦陨落 2》的单人战役模式，处于维护竞技平衡原因，因此其不支持多人游戏。对于想在 VR 下进行多人竞技的玩家，目前 CircuitLord 正在制作自己 VR FPS《No Shot》，本作主打 Rougelike 零重力射击体验。", "source": "IT之家", "category": "科技", "date": "2026-10-03", "url": "https://www.ithome.com/1/009/529.htm"}, {"id": "F20261003-042", "title": "AI 自动识别后厨违规行为，浙江 19.5 万家外卖商家接入系统", "summary": "IT之家 10 月 3 日消息，据央视财经今日报道，近日，杭州市萧山区开展网络餐饮专项整治集群执法行动，101 名执法人员共检查餐饮门店 216 家。 据介绍，2022 年 3 月 1 日起，《浙江省电子商务条例》施行。全省入网外卖商家必须以视频形式实时公开食品加工制作现场，在后厨装监控，实现“明厨亮灶”。画面同步上传监管平台与外卖平台，实现“互联网 + 明厨亮灶”监管模式。 消费者在商家订单页点击“明厨亮灶”，就能看后厨实时画面。摄像头覆盖烹调、切配等重点区域。50㎡以下小店，若 1 个摄像头能拍全重点区域，可只装 1 个；后厨有隔断或面积大于 50㎡，应增设。 AI 可自动识别后厨违规行为 ，将信息推送给监管人员，再由监管人员短信督促商家落实整改。比如，食用油禁止直接接触地面；垃圾桶必须加盖；纸浆蛋托不得堆放在地面、操作台或设备上；消毒后的餐饮具、直接入口容器工具要存放在专用密闭保洁设施内。 目前浙江省入驻有 19.5 万外卖商家 ，具备 AI 识别功能的摄像头覆盖率 97.3%。小动物进厨房、洗菜池洗拖布、在厨房吸烟等问题，都被“ 明厨 AI ”发现处置。浙江省市场监督管理局餐饮服务食品安全监管处处长邵慧群说，非现场监管让后厨环境卫生不合格率从上线时的超 28%，逐月下降至现在只有 3.9%。 IT之家注意到，根据市场监管总局今年 7 月公布信息，调查显示近 90% 受访消费", "source": "IT之家", "category": "科技", "date": "2026-10-03", "url": "https://www.ithome.com/1/009/527.htm"}, {"id": "F20261003-025", "title": "The Next Big Move In Interest Rates: How I'm Buying The Dividend Sell-Off", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951673-next-big-move-in-interest-rates-how-im-buying-dividend-sell-off?source=feed_all_articles"}, {"id": "F20261003-026", "title": "Black Hills: Scoop Up This Dividend King Now", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951690-black-hills-scoop-up-this-dividend-king-now?source=feed_all_articles"}, {"id": "F20261003-048", "title": "Ethiopia's government forces look to take regional capital from Tigray rebels", "summary": "Tigray rebels are abandoning their regional capital in northern Ethiopia, local residents said on Saturday, as pro-government forces advanced on the city. It marks a win f
