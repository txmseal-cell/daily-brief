ensitivity analysis. Across 4,452 published replication packages for five economics journals, the workflow flags discrepancies in 3,460 articles or their appendices. Second, the workflow improves the original calculations by using a different implementation or algorithm. In 496 articles, the w", "source": "NBER", "category": "科技", "date": "2026-10-03", "url": "https://www.nber.org/papers/w35782#fromrss"}, {"id": "F20261003-017", "title": "(How) Do We Teach Emotions? -- by Anjali Adukia, Matthew Bonci, Paula Dastres Gallardo, Emileigh Harrison, Jake Nicoll, Teodora Szasz", "summary": "Emotional intelligence constitutes a key component of human capital, shaped partially by educational materials. Using machine learning and generative AI tools, we examine emotional content in public-school textbooks and children’s literature. A stark mismatch emerges: text exposes children to a broad emotional range, but images overwhelmingly depict happiness and calm, regardless of emotions described in text on the same page. Nearly half of pages show zero overlap between the emotions described in text and those shown in images. This pattern persists across time, contexts, and identities. Hou", "source": "NBER", "category": "科技", "date": "2026-10-03", "url": "https://www.nber.org/papers/w35789#fromrss"}, {"id": "F20261003-025", "title": "Why Western Digital and Seagate are seeing big stock drops today", "summary": "Investors are worried that Toshiba will boost its production of a key AI storage product, potentially hurting the strong pricing power that Western Digital and Seagate currently enjoy.", "source": "MarketWatch", "category": "科技", "date": "2026-10-03", "url": "https://www.marketwatch.com/story/why-western-digital-and-seagate-are-seeing-big-stock-drops-today-6b16d95e?mod=mw_rss_topstories"}, {"id": "F20261003-045", "title": "Meta open sources code to let you make Muse AI gadgets", "summary": "Meta now lets you make your own Muse gadgets that feature the company's new AI agent with code that the company open sourced. The company suggests projects like loading Muse on a color E Ink display to show reminders, adding it to an HDMI stick so you can display Muse on a big screen, or […]", "source": "The Verge", "category": "科技", "date": "2026-10-03", "url": "https://www.theverge.com/tech/1004330/meta-muse-ai-gadgets-home-link"}, {"id": "F20261003-046", "title": "Netflix is pivoting away from prestige", "summary": "Many of Netflix's biggest critically acclaimed hits have been the products of its multiyear production deals with noted directors like David Fincher and Shawn Levy. In the past few weeks, though, the streamer has brought some of those partnerships to an end in a way that feels indicative of a larger strategic shift. With rival […]", "source": "The Verge", "category": "科技", "date": "2026-10-03", "url": "https://www.theverge.com/streaming/1004323/netflix-david-fincher-shawn-levy-mike-flanagan-duffer-brothers-greta-gerwig"}, {"id": "F20261003-047", "title": "Things That Apparently Cause Cancer", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://www.breakthroughjournal.org/p/things-that-apparently-cause-cancer"}, {"id": "F20261003-048", "title": "The Forgetful CPU (Linux on M4)", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://yuka.dev/blog-2026-10-02-linux-m4.html"}, {"id": "F20261003-049", "title": "自身股价下跌，安森美将收购 Synaptics 的对价调整为 57 亿美元现金", "summary": "IT之家 10 月 3 日消息，onsemi（安森美）美国当地时间 1 日宣布，已就修改今年 6 月 25 日公布的合并协议与 Synaptics（新突思）达成一致。 安森美将以约 57 亿美元 （IT之家注：现汇率约合 382.72 亿元人民币） 的现金 完成该笔交易 ，而不是此前公布的 70 亿美元股票，这对应 18.6% 的折让。 IT之家注意到，安森美公布收购交易同日收盘价为 118.74 美元、后一日开盘价为 98.29 美元。而安森美当前股价在 85 美元上下， 对比此前数据分别下跌了 28.4% 和 13.5% 。 安森美表示此次修订是由于 收到第三方主动提出的竞争性收购方案 ，预计此次交易将立即提升其 Non-GAAP 每股收益，并为 Synaptics 的股东带来价值确定性。 该交易预计仍将于 2027 年中期完成 ，但需获得 Synaptics 股东的批准、必要的监管机构批准以及满足其他惯例成交条件。该交易已获得美国联邦贸易委员会的批准，其他司法管辖区的监管机构正在审查该交易。 相关阅读： 《 安森美将换股收购边缘 AI 芯片企业 Synaptics，交易价值 70 亿美元 》", "source": "IT之家", "category": "科技", "date": "2026-10-03", "url": "https://www.ithome.com/1/009/410.htm"}, {"id": "F20261003-051", "title": "French Air Force plans loyal wingman flight in 2028 in sovereign AI push", "summary": "The French Air Force plans to fly crewed fighter jets in collaboration with AI-powered combat drones in 2028, under project Hypairion.", "source": "C4ISRNet", "category": "科技", "date": "2026-10-03", "url": "https://www.c4isrnet.com/global/europe/2026/10/02/french-air-force-plans-loyal-wingman-flight-in-2028-in-sovereign-ai-push/"}, {"id": "F20261003-052", "title": "How Closed Airspace Threatens U.S. Military Mobility Across Eurasia", "summary": "For much of the modern aviation era, geography was something the global aviation industry learned to overcome. Simply put, unlike a railway, a pipeline, or a highway, an aircraft does not require a continuous physical infrastructure between its point of departure and its destination. Routes could change, aircraft could move between markets, and hubs could rise and decline. If economics justified a service, aviation possessed an extraordinary ability to find another way through. Before 2022, for nearly a decade at Russian AirBridgeCargo Airlines, I watched that principle operate from inside one", "source": "War on the Rocks", "category": "科技", "date": "2026-10-03", "url": "https://warontherocks.com/how-closed-airspace-threatens-u-s-military-mobility-across-eurasia/"}, {"id": "F20261003-026", "title": "Riley Exploration Permian: Significant FCF Generation Expected In H2 2026", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951714-riley-exploration-permian-significant-fcf-generation-expected-in-2h-2026?source=feed_all_articles"}, {"id": "F20261003-027", "title": "Ardent Health Passed Its Health Check", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951712-ardent-health-passed-its-health-check?source=feed_all_articles"}, {"id": "F20261003-001", "title": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat", "summary": "The co-ordinated release is aimed at heading off further price spikes and avoiding a ban on US diesel exports.", "source": "BBC World", "category": "农业", "date": "2026-10-03", "url": "https://www.bbc.co.uk/news/articles/ck87zg8jnwngo?at_medium=RSS&at_campaign=rss"}, {"id": "F20261003-031", "title": "When Do Causal World Models Help Modular LLM Agents", "summary": "arXiv:2610.00012v1 Announce Type: new Abstract: LLM agents increasingly act through modular systems, such as order, payment, inventory, and shipment services, where actions in one module change which transitions are valid in another. Standard world models usually fit observational traces, but this is not the quantity needed for intervention-time planning: a trace may show that payment precedes shipment without identifying whether payment authorizes shipment, inventory mediates the effect, or a hidden trigger explains both. We study this gap through FedCausalCompose, a causal world-model framew", "source": "arXiv cs.AI", "category": "金融", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00012"}, {"id": "F20261003-002", "title": "US murderer Christa Pike unconscious and on ventilator after failed execution, lawyers say", "summary": "As of Thursday night, Pike remained critically ill and is being treated at a hospital in Nashville, Tennessee.", "source": "BBC World", "category": "科技", "date": "2026-10-03", "url": "https://www.bbc.co.uk/news/articles/c3kgqw7zvz47o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261003-030", "title": "Heavy-Tailed Memory Traces in Long-Horizon Language Agents", "summary": "arXiv:2610.00010v1 Announce Type: new Abstract: Long-horizon language agents increasingly rely on external memory as a frozen world model, yet current memory systems are usually judged only by task success or token cost. We argue that the missing object is the shape of memory use: under finite context and repeated retrieval, agent memory can concentrate on a small core while leaving rare states in a long tail where prediction errors accumulate. We study this effect through a conservative tail audit and find that concentration is reproducible but policy-dependent. Random-walk agents produce log", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00010"}, {"id": "F20261003-032", "title": "From Proposal to Verified Effect: Praxa, an Evidence-Bound Harness for Governed AI Agent Execution", "summary": "arXiv:2610.00015v1 Announce Type: new Abstract: Large-language-model agents can propose and execute actions, but proposal, authority, dispatch, verified external effect, and serving promotion are different claims. We present Praxa, an agent harness that represents these states explicitly through deterministic admission, brokered execution, external read-back, reconciliation, and reviewed promotion. We report four evidence lanes. First, an author-run repository-local audit at a pinned revision passed 1,027/1,027 unit tests and 89/89 Workerd tests, instrumented all 363 expected source files, and", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00015"}, {"id": "F20261003-041", "title": "Apple changes full-disk access permissions to curb abuse from AI agents", "summary": "Meta says FDA isn't sufficient to Muse reading messages. Apple begs to differ.", "source": "Ars Technica", "category": "科技", "date": "2026-10-03", "url": "https://arstechnica.com/security/2026/10/apple-changes-full-disk-access-permissions-to-curb-abuse-from-ai-agents/"}, {"id": "F20261003-042", "title": "Someone got Doom in an SQL database", "summary": "1,300 lines of SQL querying renders accurate bitmapped views of Hell at 35 fps.", "source": "Ars Technica", "category": "科技", "date": "2026
