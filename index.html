itle": "Ethiopian army pushes back Tigrayan rebels", "summary": "First, Ethiopia and Eritrea have severed ties and now with tensions spreading across the region, the African Union is urging all sides to show restraint. Meanwhile, Ethiopia's army is advancing toward the Tigrayan capital as fighting intensifies and new explosions rock Addis Ababa. Then, from boardrooms to cocoa fields, a growing number of urban Ivorians are turning to agriculture. On weekends, civil servants, entrepreneurs and traders leave Abidjan behind to tend farms in the countryside, seeking extra income. But running a plantation from afar comes with challenges. And, Senegal is counting ", "source": "France 24", "category": "科技", "date": "2026-10-03", "url": "https://www.france24.com/en/tv-shows/eye-on-africa/20261002-ethiopian-army-pushes-back-tigrayan-rebels"}, {"id": "F20261003-013", "title": "The US midterm races that will decide control of Congress – mapped", "summary": "These graphics explain what the Democrats would need to do to flip the Senate and House of Representatives A turning point in Donald Trump’s second term will soon arrive. On 3 November, voters across the US will decide whether to keep the president’s Republican allies in control of Congress, or return Democrats to the majority. Many indicators of voter sentiment suggest the Democrats are favored to take back control of the House of Representatives, and potentially the Senate. Winning either would be a significant victory for the party and give it the power to block Trump’s legislative agenda a", "source": "The Guardian", "category": "科技", "date": "2026-10-03", "url": "https://www.theguardian.com/us-news/ng-interactive/2026/oct/02/midterm-races-control-congress-charts-visuals"}, {"id": "F20261003-014", "title": "‘The enemy is tearing our city apart’: terror in Kyiv as Russia ramps up attacks", "summary": "Mayor Vitali Klitschko says Kyivans can no longer pretend it is ‘peacetime’ amid strikes on school, hospital and bridge Valeriya Tkachenko was dropping her son off at school in central Kyiv when the air raid alert sounded. Staff hurried the children and parents into the shelter, where the frightened lawyer spent the next two hours with her son. “I’m scared to death all day about what could happen to my son,” she said as she emerged from the shelter, already late for work. Continue reading...", "source": "The Guardian", "category": "科技", "date": "2026-10-03", "url": "https://www.theguardian.com/world/2026/oct/02/terror-kyiv-russia-ramps-up-attacks-ukraine"}, {"id": "F20261003-022", "title": "Ford fends off Hyundai to retain No. 3 U.S. sales position in third quarter", "summary": "Ford on Friday reported a year-over-year sales decline of 6.6% during the third quarter to 507,395 light-duty vehicles.", "source": "CNBC", "category": "科技", "date": "2026-10-03", "url": "https://www.cnbc.com/2026/10/02/ford-q3-sales.html"}, {"id": "F20261003-023", "title": "FAA says Boeing 737 Max software glitch not a flight-safety issue", "summary": "The FAA on Monday said it was reviewing the software glitch, which could affect procedures during certain landings.", "source": "CNBC", "category": "科技", "date": "2026-10-03", "url": "https://www.cnbc.com/2026/10/02/faa-says-boeing-737-max-10-software-glitch-not-a-flight-safety-issue.html"}, {"id": "F20261003-028", "title": "Trump Says South Korea Deal Includes $8.4 Billion U.S. Oil Project", "summary": "President Donald Trump said Friday that South Korea’s investment agreement with the United States now includes $8.4 billion for an enhanced oil recovery project. Seoul says it agreed to no such thing. “The Republic of Korea Deal keeps getting BETTER! 8.4 Billion Dollars for an enhanced Oil Recovery Project. Producing more Oil and Gas means American Energy Dominance and Energy Security in the World for the Future!” Trump wrote on Truth Social. Enhanced oil recovery (EOR) is used to squeeze more production from aging fields after…", "source": "OilPrice", "category": "科技", "date": "2026-10-03", "url": "https://oilprice.com/Latest-Energy-News/World-News/Trump-Says-South-Korea-Deal-Includes-84-Billion-US-Oil-Project.html"}, {"id": "F20261003-037", "title": "Open-sourcing AstaBrief, the fast report-generation model in Asta", "summary": "", "source": "Hugging Face", "category": "科技", "date": "2026-10-03", "url": "https://huggingface.co/blog/allenai/astabrief"}, {"id": "F20261003-038", "title": "AutoSynthData: Generating Training Data for Enterprise Agents", "summary": "", "source": "Hugging Face", "category": "科技", "date": "2026-10-03", "url": "https://huggingface.co/blog/ServiceNow-AI/autosynthdata"}, {"id": "F20261003-039", "title": "Meta wants your next gadget to be Muse-infused", "summary": "Meta wants Muse in your TV and your toaster, so it's giving the code away for free.", "source": "TechCrunch", "category": "科技", "date": "2026-10-03", "url": "https://techcrunch.com/2026/10/02/meta-wants-you-to-build-your-own-muse-gadget/"}, {"id": "F20261003-024", "title": "‘I don’t want to die on the sales floor’: I’m 67 and earn $19.50 an hour at a big-box store. When can I finally retire?", "summary": "“I started taking Social Security at 66 and receive $2,410 a month. I have $214,000 in my 401(k).”", "source": "MarketWatch", "category": "金融", "date": "2026-10-03", "url": "https://www.marketwatch.com/story/i-dont-want-to-die-on-the-sales-floor-im-67-and-earn-19-50-an-hour-at-a-big-box-store-when-can-i-finally-retire-369abcf9?mod=mw_rss_topstories"}, {"id": "F20261003-016", "title": "An LLM Workflow That Reproduces, Improves, and Extends Published Economics Research -- by Matthew Schwartz, Isaiah Andrews, Jesse M. Shapiro", "summary": "We introduce an open-source workflow that enables an LLM to reproduce, improve, and extend an economics article using the article’s published replication package. First, the workflow attempts to reproduce the original calculations, checks for discrepancies with published findings, and performs automated sensitivity analysis. Across 4,452 published replication packages for five economics journals, the workflow flags discrepancies in 3,460 articles or their appendices. Second, the workflow improves the original calculations by using a different implementation or algorithm. In 496 articles, the w", "source": "NBER", "category": "科技", "date": "2026-10-03", "url": "https://www.nber.org/papers/w35782#fromrss"}, {"id": "F20261003-017", "title": "(How) Do We Teach Emotions? -- by Anjali Adukia, Matthew Bonci, Paula Dastres Gallardo, Emileigh Harrison, Jake Nicoll, Teodora Szasz", "summary": "Emotional intelligence constitutes a key component of human capital, shaped partially by educational materials. Using machine learning and generative AI tools, we examine emotional content in public-school textbooks and children’s literature. A stark mismatch emerges: text exposes children to a broad emotional range, but images overwhelmingly depict happiness and calm, regardless of emotions described in text on the same page. Nearly half of pages show zero overlap between the emotions described in text and those shown in images. This pattern persists across time, contexts, and identities. Hou", "source": "NBER", "category": "科技", "date": "2026-10-03", "url": "https://www.nber.org/papers/w35789#fromrss"}, {"id": "F20261003-025", "title": "Why Western Digital and Seagate are seeing big stock drops today", "summary": "Investors are worried that Toshiba will boost its production of a key AI storage product, potentially hurting the strong pricing power that Western Digital and Seagate currently enjoy.", "source": "MarketWatch", "category": "科技", "date": "2026-10-03", "url": "https://www.marketwatch.com/story/why-western-digital-and-seagate-are-seeing-big-stock-drops-today-6b16d95e?mod=mw_rss_topstories"}, {"id": "F20261003-045", "title": "Meta open sources code to let you make Muse AI gadgets", "summary": "Meta now lets you make your own Muse gadgets that feature the company's new AI agent with code that the company open sourced. The company suggests projects like loading Muse on a color E Ink display to show reminders, adding it to an HDMI stick so you can display Muse on a big screen, or […]", "source": "The Verge", "category": "科技", "date": "2026-10-03", "url": "https://www.theverge.com/tech/1004330/meta-muse-ai-gadgets-home-link"}, {"id": "F20261003-046", "title": "Netflix is pivoting away from prestige", "summary": "Many of Netflix's biggest critically acclaimed hits have been the products of its multiyear production deals with noted directors like David Fincher and Shawn Levy. In the past few weeks, though, the streamer has brought some of those partnerships to an end in a way that feels indicative of a larger strategic shift. With rival […]", "source": "The Verge", "category": "科技", "date": "2026-10-03", "url": "https://www.theverge.com/streaming/1004323/netflix-david-fincher-shawn-levy-mike-flanagan-duffer-brothers-greta-gerwig"}, {"id": "F20261003-047", "title": "Things That Apparently Cause Cancer", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://www.breakthroughjournal.org/p/things-that-apparently-cause-cancer"}, {"id": "F20261003-048", "title": "The Forgetful CPU (Linux on M4)", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://yuka.dev/blog-2026-10-02-linux-m4.html"}, {"id": "F20261003-049", "title": "自身股价下跌，安森美将收购 Synaptics 的对价调整为 57 亿美元现金", "summary": "IT之家 10 月 3 日消息，onsemi（安森美）美国当地时间 1 日宣布，已就修改今年 6 月 25 日公布的合并协议与 Synaptics（新突思）达成一致。 安森美将以约 57 亿美元 （IT之家注：现汇率约合 382.72 亿元人民币） 的现金 完成该笔交易 ，而不是此前公布的 70 亿美元股票，这对应 18.6% 的折让。 IT之家注意到，安森美公布收购交易同日收盘价为 118.74 美元、后一日开盘价为 98.29 美元。而安森美当前股价在 85 美元上下， 对比此前数据分别下跌了 28.4% 和 13.5% 。 安森美表示此次修订是由于 收到第三方主动提出的竞争性收购方案 ，预计此次交易将立即提升其 Non-GAAP 每股收益，并为 Synaptics 的股东带来价值确定性。 该交易预计仍将于 2027 年中期完成 ，但需获得 Synaptics 股东的批准、必要的监管机构批准以及满足其他惯例成交条件。该交易已获得美国联邦贸易委员会的批准，其他司法管辖区的监管机构正在审查该交易。 相关阅读： 《 安森美将换股收购边缘 AI 芯片企业 Synaptics，交易价值 70 亿美元 》", "source": "IT之家", "category": "科技", "date": "2026-10-03", "url": "https://www.ithome.com/1/009/410.htm"}, {"id": "F20261003-051", "title": "French Air Force plans loyal wingman flight in 2028 in sovereign AI push", "summary": "The French Air Force plans to fly crewed fighter jets in collaboration with AI-powered combat drones in 2028, under project Hypairion.", "source": "C4ISRNet", "category": "科技", "date": "2026-10-03", "url": "https://www.c4isrnet.com/global/europe/2026/10/02/french-air-force-plans-loyal-wingman-flight-in-2028-in-sovereign-ai-push/"}, {"id": "F20261003-052", "title": "How Closed Airspace Threatens U.S. Military Mobility Across Eurasia", "summary": "For much of the modern aviation era, geography was something the global aviation industry learned to overcome. Simply put, unlike a railway, a pipeline, or a highway, an aircraft does not require a continuous physical infrastructure between its point of departure and its destination. Routes could change, aircraft could move between markets, and hubs could rise and decline. If economics justified a service, aviation possessed an extraordinary ability to find another way through. Before 2022, for nearly a decade at Russian AirBridgeCargo Airlines, I watched that principle operate from inside one", "source": "War on the Rocks", "category": "科技", "date": "2026-10-03", "url": "https://warontherocks.com/how-closed-airspace-threatens-u-s-military-mobility-across-eurasia/"}, {"id": "F20261003-026", "title": "Riley Exploration Permian: Significant FCF Generation Expected In H2 2026", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951714-riley-exploration-permian-significant-fcf-generation-expected-in-2h-2026?source=feed_all_articles"}, {"id": "F20261003-027", "title": "Ardent Health Passed Its Health Check", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951712-ardent-health-passed-its-health-check?source=feed_all_articles"}, {"id": "F20261003-001", "title": "G7 to release 100 million barrels of oil and diesel after Trump export ban threat", "summary": "The co-ordinated release is aimed at heading off further price spikes and avoiding a ban on US diesel exports.", "source": "BBC World", "category": "农业", "date": "2026-10-03", "url": "https://www.bbc.co.uk/news/articles/ck87zg8jnwngo?at_medium=RSS&at_campaign=rss"}, {"id": "F20261003-031", "title": "When Do Causal World Models Help Modular LLM Agents", "summary": "arXiv:2610.00012v1 Announce Type: new Abstract: LLM agents increasingly act through modular systems, such as order, payment, inventory, and shipment services, where actions in one module change which transitions are valid in another. Standard world models usually fit observational traces, but this is not the quantity needed for intervention-time planning: a trace may show that payment precedes shipment without identifying whether payment authorizes shipment, inventory mediates the effect, or a hidden trigger explains both. We study this gap through FedCausalCompose, a causal world-model framew", "source": "arXiv cs.AI", "category": "金融", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00012"}, {"id": "F20261003-002", "title": "US murderer Christa Pike unconscious and on ventilator after failed execution, lawyers say", "summary": "As of Thursday night, Pike remained critically ill and is being treated at a hospital in Nashville, Tennessee.", "source": "BBC World", "category": "科技", "date": "2026-10-03", "url": "https://www.bbc.co.uk/news/articles/c3kgqw7zvz47o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261003-030", "title": "Heavy-Tailed Memory Traces in Long-Horizon Language Agents", "summary": "arXiv:2610.00010v1 Announce Type: new Abstract: Long-horizon language agents increasingly rely on external memory as a frozen world model, yet current memory systems are usually judged only by task success or token cost. We argue that the missing object is the shape of memory use: under finite context and repeated retrieval, agent memory can concentrate on a small core while leaving rare states in a long tail where prediction errors accumulate. We study this effect through a conservative tail audit and find that concentration is reproducible but policy-dependent. Random-walk agents produce log", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00010"}, {"id": "F20261003-032", "title": "From Proposal to Verified Effect: Praxa, an Evidence-Bound Harness for Governed AI Agent Execution", "summary": "arXiv:2610.00015v1 Announce Type: new Abstract: Large-language-model agents can propose and execute actions, but proposal, authority, dispatch, verified external effect, and serving promotion are different claims. We present Praxa, an agent harness that represents these states explicitly through deterministic admission, brokered execution, external read-back, reconciliation, and reviewed promotion. We report four evidence lanes. First, an author-run repository-local audit at a pinned revision passed 1,027/1,027 unit tests and 89/89 Workerd tests, instrumented all 363 expected source files, and", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-03", "url": "https://arxiv.org/abs/2610.00015"}, {"id": "F20261003-041", "title": "Apple changes full-disk access permissions to curb abuse from AI agents", "summary": "Meta says FDA isn't sufficient to Muse reading messages. Apple begs to differ.", "source": "Ars Technica", "category": "科技", "date": "2026-10-03", "url": "https://arstechnica.com/security/2026/10/apple-changes-full-disk-access-permissions-to-curb-abuse-from-ai-agents/"}, {"id": "F20261003-042", "title": "Someone got Doom in an SQL database", "summary": "1,300 lines of SQL querying renders accurate bitmapped views of Hell at 35 fps.", "source": "Ars Technica", "category": "科技", "date": "2026 ubai flight 1073 heralded, eye witnesses report seeing the co-pilot trying to kill the pilot and destroying the cockpit controls in order to crash the plane. Despite being stabbed repeatedly, Captan Smit Machchhar managed to open the cockpit door, allowing passengers to overwhelm the suspect and regain control of the aircraft after its rapid descent of more than 14,000 feet in 30 seconds. They prevented a 9/11-style catastrophe, Israeli Prime Minister Benjamin Netanyahu said.", "source": "France 24", "category": "科技", "date": "2026-10-03", "url": "https://www.france24.com/en/tv-shows/the-debate/20261003-barricades-the-blame-game-the-french-school-protests"}, {"id": "F20261003-023", "title": "These companies look set to face high-profile hearings and other scrutiny if Democrats win the House", "summary": "Law and lobbying firms in Washington, D.C., are telling companies to prepare for a new level of scrutiny, since most modern midterm elections result in some loss of congressional control for the party that holds the White House.", "source": "MarketWatch", "category": "金融", "date": "2026-10-03", "url": "https://www.marketwatch.com/story/these-companies-look-set-to-face-high-profile-hearings-and-other-scrutiny-if-democrats-win-the-house-513fe8e7?mod=mw_rss_topstories"}, {"id": "F20261003-039", "title": "An AI agent emailed researchers for help. It told us why", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-03", "url": "https://www.science.org/content/article/exclusive-ai-agent-emailed-hundreds-researchers-help-it-told-us-why"}, {"id": "F20261003-041", "title": "开发者为经典 FPS《泰坦陨落 2》单人战役模式推出免费 VR 模组：支持体感操作武器换弹", "summary": "IT之家 10 月 3 日消息，模组作者 CircuitLord 宣布为经典 FPS 游戏《泰坦陨落 2》推出一款免费 VR 模组，为游戏加入头部追踪、武器瞄准、机甲武器控制以及手动换弹等功能，玩家可以通过 CircuitLord 制作的 Mod 安装器进行快速安装。 除了头部追踪和 VR 武器瞄准外，玩家还可以利用手部控制器直接操作机甲武器，并使用体感手势动作为部分武器进行换弹，以取得更加沉浸式的效果。 CircuitLord 同时表示，《泰坦陨落 2》本身就是以高速移动著称的 FPS，因此 VR 版本对于玩家的适应能力要求更高。游戏中的跑墙、空中移动以及利用抓钩高速穿越战场等操作，会产生比传统平面屏幕游戏更加明显的视角变化， 可能导致部分玩家因此出现晕动情况，相应玩家可以单独开启模组的“辅助移动”功能，以降低不适情况 。 不过，目前这款 VR Mod 仅支持《泰坦陨落 2》的单人战役模式，处于维护竞技平衡原因，因此其不支持多人游戏。对于想在 VR 下进行多人竞技的玩家，目前 CircuitLord 正在制作自己 VR FPS《No Shot》，本作主打 Rougelike 零重力射击体验。", "source": "IT之家", "category": "科技", "date": "2026-10-03", "url": "https://www.ithome.com/1/009/529.htm"}, {"id": "F20261003-042", "title": "AI 自动识别后厨违规行为，浙江 19.5 万家外卖商家接入系统", "summary": "IT之家 10 月 3 日消息，据央视财经今日报道，近日，杭州市萧山区开展网络餐饮专项整治集群执法行动，101 名执法人员共检查餐饮门店 216 家。 据介绍，2022 年 3 月 1 日起，《浙江省电子商务条例》施行。全省入网外卖商家必须以视频形式实时公开食品加工制作现场，在后厨装监控，实现“明厨亮灶”。画面同步上传监管平台与外卖平台，实现“互联网 + 明厨亮灶”监管模式。 消费者在商家订单页点击“明厨亮灶”，就能看后厨实时画面。摄像头覆盖烹调、切配等重点区域。50㎡以下小店，若 1 个摄像头能拍全重点区域，可只装 1 个；后厨有隔断或面积大于 50㎡，应增设。 AI 可自动识别后厨违规行为 ，将信息推送给监管人员，再由监管人员短信督促商家落实整改。比如，食用油禁止直接接触地面；垃圾桶必须加盖；纸浆蛋托不得堆放在地面、操作台或设备上；消毒后的餐饮具、直接入口容器工具要存放在专用密闭保洁设施内。 目前浙江省入驻有 19.5 万外卖商家 ，具备 AI 识别功能的摄像头覆盖率 97.3%。小动物进厨房、洗菜池洗拖布、在厨房吸烟等问题，都被“ 明厨 AI ”发现处置。浙江省市场监督管理局餐饮服务食品安全监管处处长邵慧群说，非现场监管让后厨环境卫生不合格率从上线时的超 28%，逐月下降至现在只有 3.9%。 IT之家注意到，根据市场监管总局今年 7 月公布信息，调查显示近 90% 受访消费", "source": "IT之家", "category": "科技", "date": "2026-10-03", "url": "https://www.ithome.com/1/009/527.htm"}, {"id": "F20261003-025", "title": "The Next Big Move In Interest Rates: How I'm Buying The Dividend Sell-Off", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951673-next-big-move-in-interest-rates-how-im-buying-dividend-sell-off?source=feed_all_articles"}, {"id": "F20261003-026", "title": "Black Hills: Scoop Up This Dividend King Now", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-03", "url": "https://seekingalpha.com/article/4951690-black-hills-scoop-up-this-dividend-king-now?source=feed_all_articles"}, {"id": "F20261003-048", "title": "Ethiopia's government forces look to take regional capital from Tigray rebels", "summary": "Tigray rebels are abandoning their regional capital in northern Ethiopia, local residents said on Saturday, as pro-government forces advanced on the city. It marks a win f  "科技", "date": "2026-10-04", "url": "https://news.ycombinator.com/item?id=49949438"}, {"id": "F20261004-040", "title": "智己汽车：国庆前 3 天，全系车型锁单破 2000 台", "summary": "IT之家 10 月 4 日消息，智己汽车今日宣布， 国庆前 3 天，全系车型锁单破 2000 台 。 上汽集团最新销量数据显示 ，智己汽车 1-9 月累计销售 6 万辆，同比增长 40.1%，全新一代智己 LS6 上市 57 分钟，新增订单突破 1.1 万台。 据IT之家此前报道， 全新一代智己 LS6 于 9 月 23 日正式上市 ，定位“全线控大五座家庭 SUV”，官方指导价 20.29 万元起，叠加上市权益后 19.79 万元起。 Max 版 19.79 万元：76kWh 电池，CLTC 650km 超级后驱，零百加速 6.4s Pro Max 版 21.79 万元：93kWh 电池，CLTC 782km 超级后驱，零百加速 5.4s Ultra 版 25.99 万元：103kWh 电池，CLTC 750km 矢量四驱，零百加速 3.48s 全新一代智己 LS6 的车身尺寸为 4937mm×1988mm×1671mm，轴距 2960mm。全系标配全新一代三电系统，包括全域 800V NEO 三电架构、全新 NEO 飓风电机、全新 IM ECU Master 能效大师管理系统 3.0。", "source": "IT之家", "category": "科技", "date": "2026-10-04", "url": "https://www.ithome.com/1/009/626.htm"}, {"id": "F20261004-041", "title": "别上当：网传《GTA 6》完整可游玩版泄露都是圈套", "summary": "IT之家 10 月 4 日消息，有关《GTA 6》完整可游玩版本已经在网上泄露的说法再度在网络上传播发酵，而距离第一批虚假的“CyberLeek”下载资源开始流传已经过去了数月时间。 一条标题写着“GTA 6 完整游戏遭到泄露”的 TikTok 短视频收获了超过 30.6 万个点赞、4.4 万次转发、3.6 万次收藏以及 5600 条评论。该视频引导用户去下载一个名为“Grand Theft Auto VI CYBERLEEK‑ build.v1.0.245.ISO ”的资源，声称这就是游戏的完整本体。 该资源页面标注此版本上传时间为 2026 年 8 月 26 日，文件大小 130GB，页面显示当前有 1337 个做种节点、42 个下载节点。然而这些数据全部是该网站自行展示出来的，无法通过第三方渠道核实真伪。查看内部文件列表还可以发现，里面的“ GTAVI_INSTALLER.exe ”安装程序大小显示为 0 字节。 更值得留意的是，这一份 130GB 的下载包并不是市面上唯一打着 CyberLeek 名号的虚假泄露版本。早在 8 月 22 日，游戏资讯网站 VGA4A 就已经发现同名“CYBERLEEK‑ build.v1.0.245.ISO ”的种子文件，版本体积约 145GB；当时网站就发出警示：即便文件名附带伪造的 Windows、Steam 元数据信息，也不能证明这份资", "source": "IT之家", "category": "科技", "date": "2026-10-04", "url": "https://www.ithome.com/1/009/625.htm"}, {"id": "F20261004-026", "title": "CEF Weekly Review: XFLT Launches Promised Tender Offer", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-04", "url": "https://seekingalpha.com/article/4951799-cef-weekly-review-xflt-launches-promised-tender-offer?source=feed_all_articles"}, {"id": "F20261004-044", "title": "The ancient African rice that could help farmers grapple with climate change", "summary": "Thousands of years ago, farmers in West Africa took a wild ancestor of rice and turned it into a crop of their own. But it was difficult to harvest and, over time, globally dominant Asian rice pushed it aside. Yet African rice survived in some of the region's harshest growing conditions, coping with drought, deep water, poor soil, pests and punishing heat. Now, researchers in China may have found a way to make its hard-won traits easier for breeders to harness.", "source": "RFI", "category": "农业", "date": "2026-10-04", "url": "https://www.rfi.fr/en/environment/20261003-ancient-african-rice-could-help-farmers-face-a-hotter-world-oryza-glaberrima-nanjing-agricultural-university"}, {"id": "F20261004-025", "title": "American Airlines Is In The Best Of Times, Worst Of Times", "summary": "", "source": "Seeking Alpha", "category": "科技", "date": "2026-10-04", "url": "https://seekingalpha.com/article/4951800-american-airlines-is-in-the-best-of-times-worst-of-times?source=feed_all_articles"}, {"id": "F20261004-001", "title": "Tennessee prison chief to resign after Christa Pike's failed execution", "summary": "Pike's lawyers said the failure \"goes far beyond any one person\". Pike is in critical condition after surviving two lethal injections.", "source": "BBC World", "category": "科技", "date": "2026-10-04", "url": "https://www.bbc.co.uk/news/articles/c8zxl62yzxzxo?at_medium=RSS&at_campaign=rss"}, {"id": "F20261004-029", "title": "This protective enzyme could help stop fatty liver disease from getting worse", "summary": "Scientists have identified an enzyme that may act as a natural defense against the worsening of fatty liver disease, which affects an estimated 100 million Americans. The enzyme, called UBE2N, helps liver cells clear away damaged mitochondria and break down fat, potentially preventing the inflammation, scarring, and cell damage associated with the more dangerous condition MASH.", "source": "ScienceDaily", "category": "科技", "date": "2026-10-04", "url": "https://www.sciencedaily.com/releases/2026/10/261002080020.htm"}, {"id": "F20261004-030", "title": "ESA’s Juice just used Earth as a slingshot to Jupiter", "summary": "ESA’s Juice spacecraft raced past Earth on September 28, using our planet’s gravity to dramatically reshape its path toward Jupiter without burning much fuel. The flyby changed its direction by 20 degrees and increased its speed by 3.5 km/s, while also giving scientists a rare chance to test its instruments on Earth and the Moon.", "source": "ScienceDaily", "category": "科技", "date": "2026-10-04", "url": "https://www.sciencedaily.com/releases/2026/10/261001214102.htm"}, {"id": "F20261004-034", "title": "Milt Windler, NASA flight director who helped save Apollo 13, dies at 94", "summary": "\"...we were making history.\"", "source": "Ars Technica", "category": "科技", "date": "2026-10-04", "url": "https://arstechnica.com/space/2026/10/milt-windler-nasa-flight-director-who-helped-save-apollo-13-dies-at-94/"}, {"id": "F20261004-035", "title": "The dawn of the age of the exoskeleton", "summary": "The devices continue to show noticeable benefits for users in various real-world tasks.", "source": "Ars Technica", "category": "科技", "date": "2026-10-04", "url": "https://arstechnica.com/science/2026/10/the-dawn-of-the-age-of-the-exoskeleton/"}, {"id": "F20261004-042", "title": "Azerbaijan, Turkey and Uzbekistan join forces in major military exercise", "summary": "Thousands of military personnel from Azerbaijan, Turkey and Uzbekistan, as well as other nations participating as observers, including Iran, joined forces in the “Power of Unity, 2026” military exercise for the first time, in the Hojavend district of Azerbaijan’s Karabakh region.", "source": "Euronews", "category": "科技", "date": "2026-10-04", "url": "https://www.euronews.com/2026/10/03/azerbaijan-turkey-and-uzbekistan-join-forces-in-major-military-exercise"}, {"id": "F20261004-004", "title": "Zimbabweans struggle to rebuild after fleeing xenophobia in South Africa", "summary": ith touch starvation? “It’s becoming obvious to me that I’ll probably be alone forever,” he wrote. He used to be worried about missing out on sex, but now he just misses hugs. Cuddles. “I don’t have many friends and none with that kind of physical relationship. I don’t really hug family either anymor", "source": "The Guardian", "category": "新闻", "date": "2026-10-04", "url": "https://www.theguardian.com/society/ng-interactive/2026/oct/04/young-generation-lonely-silence"}, {"id": "F20261004-014", "title": "‘One person turned up at my house’: Russell T Davies on fierce fandom, finding love after grief - and the fear that drives him to keep a knife by the door", "summary": "He’s the titan of TV who revived a flatlined Doctor Who and turned British queer life into jaw-dropping drama. But the screenwriter’s groundbreaking writing has sometimes made him a target of hate – from homophobes and Whovians alike • ‘Goodbye Whoniverse. God, that was fun!’: Read an exclusive extract from Davies’s memoir Russell T Davies is a man who prefers to look on the bright side. That time he was gay-bashed by a gang of bus conductors? “People have been beaten up far worse than me, that was just a bit of a thumping in the street.” When the production schedule of his dystopian drama Yea", "source": "The Guardian", "category": "新闻", "date": "2026-10-04", "url": "https://www.theguardian.com/media/2026/oct/03/russell-t-davies-interview-doctor-who-fierce-fandom-love-grief"}, {"id": "F20261004-002", "title": "Cornell president says university 'must do better' after frat house rape allegations", "summary": "Michael Kotlikoff described the allegations of a woman who says she was drugged and gang raped as \"deeply disturbing\".", "source": "BBC World", "category": "新闻", "date": "2026-10-04", "url": "https://www.bbc.co.uk/news/articles/ckly0leelnz4o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261004-043", "title": "Tens of thousands take to Madrid streets demanding housing action", "summary": "Tens of thousands of protesters marched through Madrid demanding affordable housing and stronger protections for renters, a day after lawmakers rejected emergency housing measures.", "source": "Euronews", "category": "新闻", "date": "2026-10-04", "url": "https://www.euronews.com/video/2026/10/03/tens-of-thousands-take-to-madrid-streets-demanding-housing-action"}, {"id": "F20261004-045", "title": "As students call for 'act three', can France's school protests keep momentum?", "summary": "Student protests that began in and around Paris last week have since reached secondary schools across France. Talks with the education minister haven't satisfied pupils' demands to tackle teacher shortages, neglected facilities and overcrowded classrooms. As student unions call for a fresh round of protests next week, whether the movement spreads to universities could prove decisive.", "source": "RFI", "category": "新闻", "date": "2026-10-04", "url": "https://www.rfi.fr/en/france/20261003-as-students-call-for-act-three-can-france-s-school-protests-keep-momentum"}, {"id": "F20261005-018", "title": "Asian Stocks to Rise as Hike Bets Ease, Oil Climbs: Markets Wrap", "summary": "Asian stocks were poised to gain after a softer US jobs data report eased pressure on the Federal Reserve to keep raising interest rates. Brent crude rose as Yemen launched a bid to recapture Houthi-controlled areas.", "source": "Bloomberg", "category": "金融", "date": "2026-10-05", "url": "https://www.bloomberg.com/news/articles/2026-10-04/asian-stocks-to-rise-as-hike-bets-ease-oil-climbs-markets-wrap"}, {"id": "F20261005-006", "title": "Mysterious luminous object burns in the skies above Libya", "summary": "A mysterious object has been filmed flying over Tripoli and western Libya, followed by reports of a loud explosion.", "source": "Al Jazeera", "category": "金融", "date": "2026-10-05", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/4/mysterious-luminous-object-burns-in-the-skies-above-libya?traffic_source=rss"}, {"id": "F20261005-019", "title": "Schneider Said to Near Deal to Buy PTC for More Than $20 Billion", "summary": "Schneider Electric SE is nearing a deal to acquire US-based engineering software developer PTC Inc. for more than $20 billion, according to a source familiar with the matter.", "source": "Bloomberg", "category": "科技", "date": "2026-10-05", "url": "https://www.bloomberg.com/news/articles/2026-10-04/schneider-said-to-near-deal-to-buy-ptc-for-more-than-20-billion"}, {"id": "F20261005-020", "title": "Supreme Court Opens Term With Climate Fight", "summary": "Bloomberg Supreme Court Reporter Greg Stohr is on Bloomberg This Weekend previewing a new term shaped by the court’s growing emergency docket and a major climate case over whether Boulder, Colorado, can pursue state-law claims against oil companies. Speaking with hosts David Gura and Christina Ruffini, Stohr says Justice Samuel Alito’s recusal creates the possibility of a 4-4 split and discusses renewed questions about Supreme Court ethics, potential changes to the court and Alito’s eventual retirement. (Source: Bloomberg)", "source": "Bloomberg", "category": "科技", "date": "2026-10-05", "url": "https://www.bloomberg.com/news/videos/2026-10-04/supreme-court-opens-term-with-climate-fight-video"}, {"id": "F20261005-027", "title": "Fuel Price Shock Pushes Global Gas Car Sales Below 50% for First Time", "summary": "The share of gasoline cars in global vehicle sales fell below 50% for the first time ever as the Hormuz shock and the resulting record-high fuel prices accelerated the previously sluggish shift toward EVs outside China. A few years ago, China blew past the threshold of 50% of all car sales being hybrids and EVs, and the share is now about 55%. But the rest of the world didn’t follow until the Iran war disrupted the fuel markets. Global sales shares of EVs are far from the Chinese numbers, but the shift toward electric vehicles has been remarkably…", "source": "OilPrice", "category": "农业", "date": "2026-10-05", "url": "https://oilprice.com/Energy/Energy-General/Fuel-Price-Shock-Pushes-Global-Gas-Car-Sales-Below-50-for-First-Time.html"}, {"id": "F20261005-022", "title": "Trump reiterates pledge to send $5,000 checks, and hands out smaller payments, as midterm elections loom", "summary": "Trump is promoting two federal payment programs already underway while reiterating a $5,000 dividend promise contingent on Republicans retaining Congress.", "source": "CNBC", "category": "金融", "date": "2026-10-05", "url": "https://www.cnbc.com/2026/10/04/trump-5000-checks-cash-payments-midterms.html"}, {"id": "F20261005-028", "title": "Europe’s Diesel Woes Just Got Even Worse", "summary": "China this week announced it will suspend all fuel exports this month to keep its domestic market supplied. Also this week, President Donald Trump demanded that Germany and France release 120 million barrels of diesel from their storage or get hit with a U.S. diesel export ban. Europe is running out of options to stay well supplied with a critical fuel. Diesel is the fuel, on which any economy runs. While it may feature less commonly in passenger cars these days, diesel is the default fuel for heavy machinery, agriculture, and freight transport.…", "source": "OilPrice", "category": "经济", "date": "2026-10-05", "url": "https://oilprice.com/Energy/Crude-Oil/Europes-Diesel-Woes-Just-Got-Even-Worse.html"}, {"id": "F20261005-007", "title": "Brazil votes, with Lula facing Bolsonaro's son", "summary": "In Brazil, President Lula da Silva faces Flávio Bolsonaro, son of the jailed former president, in a tight race. If neither wins more than half the votes they'll face each other again on Oct. 25.", "source": "NPR", "category": "科技", "date": "2026-10-05", "url": "https://www.npr.org/2026/10/04/nx-s1-5981107/brazil-votes-with-lula-facing-bolsonaros-son"}, {"id": "F20261005-008", "title": "Trump names national intelligence chief Jay Clayton as new AI czar", "summary": "Trump said Clayton will lead the White Ho pressif 的 ESP32-C5 DevKitC-1（官方推荐）、M5Stack StickS3、Waveshare ESP32-S3-Touch-AMOLED-1.75C、Seeed 的电子纸显示屏等。其中后六款开发板可运行完整的屏幕 UI，包括动画头像、按键通话和设置功能。内存充足的开发板还支持家庭网络隧道，使 Muse 能够访问用户已拥有的设备，以及任何暴露本地 HTTP API 的自建设备。 Linux SDK 方面，Meta 已支持树莓派 3B+、4、5、Zero 2 W，以及其他具备蓝牙低功耗能力的 Linux 设备，系统最低要求为 Raspberry Pi OS Bullseye、Debian 11、Ubuntu 22.", "source": "IT之家", "category": "科技", "date": "2026-10-05", "url": "https://www.ithome.com/1/009/743.htm"}, {"id": "F20261005-039", "title": "IT早报 1005：乐山大佛“掏耳朵”视频系 AI 合成；央视曝光外卖“明厨亮灶”造假；余承东称华为已量产 381 款 τ 芯片；马斯克确认 SpaceXAI 将更名 SpaceXSI...", "summary": "“IT早报”时间，大家好，现在是 2026 年 10 月 5 日星期一，今天的重要科技资讯有： 1. 乐山大佛景区回应网传“掏耳朵”养护作业视频：系 AI 合成，佛耳内并无所谓“杂物” 网传视频显示文保工人给大佛掏耳朵、掏鼻孔，还出现猴子抢安全帽等离谱画面。乐山大佛管委会回应称该视频系他人 AI 生成，并非真实场景。2026 年以来大佛已开展 5 次保养维护，耳鼻内并无杂物，凌云山片区也没有猴子。>> 查看详情 2. 央视曝光外卖“明厨亮灶”造假，湖北、云南等地核查处置 针对外卖商户摄像头随意摆放、故意偏移角度规避监督等问题，市场监管总局迅速部署湖南、湖北、云南等地开展核查处置。武汉对曝光商户立案调查并督促平台下架，丽江对 4 家涉事门店停业整顿，并启动外卖食品安全集中整治行动。>> 查看详情 3. 特朗普将“人工智能”改为“超级智能”后，马斯克确认 SpaceXAI 将更名为 SpaceXSI 埃隆 · 马斯克 10 月 4 日在 X 平台表示，SpaceX 是一家超级智能公司。>> 查看详情 4. 余承东：华为半导体已在手机、AI、智能汽车等领域成功设计并量产 381 款 τ 芯片 华为常务董事、产品投资评审委员会主任、终端 BG 董事长余承东 10 月 4 日发布视频，透露华为半导体已经在手机、AI、通用计算、网络、智能汽车等多个领域成功设计并量产了 381 款 τ 芯片。>", "source": "IT之家", "category": "科技", "date": "2026-10-05", "url": "https://www.ithome.com/1/009/742.htm"}, {"id": "F20261005-025", "title": "Elemental Royalty Corporation (ELE:CA) Presents at Mining Forum Americas 2026 - Slideshow", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-05", "url": "https://seekingalpha.com/article/4951866-elemental-royalty-corporation-ele-ca-presents-at-mining-forum-americas-2026-slideshow?source=feed_all_articles"}, {"id": "F20261005-026", "title": "DVY: A Strong Option To Balance Out A Tech-Heavy Portfolio (Rating Upgrade)", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-05", "url": "https://seekingalpha.com/article/4951865-dvy-a-strong-option-to-balance-out-a-tech-heavy-portfolio-rating-upgrade?source=feed_all_articles"}, te": "2026-10-06", "url": "https://www.dw.com/en/icc-unseals-taliban-leaders-warrants-over-persecuting-women/a-79556631?maca=en-rss-en-all-1573-rdf"}, {"id": "F20261006-011", "title": "Switching on brain cells: the Nobel-winning science of optogenetics", "summary": "The Nobel medicine prize was awarded Monday to US psychiatrist and neurologist Karl Deisseroth and German scientists Peter Hegemann and Georg Nagel for their pioneering work in the neuroscience field of optogenetics. In optogenetics, scientists control neurones by stimulating them with light -- potentially unlocking breakthroughs for conditions such as dementia, depression and blindness. FRANCE 24's Monte Francis reports.", "source": "France 24", "category": "科技", "date": "2026-10-06", "url": "https://www.france24.com/en/switching-on-brain-cells-the-nobel-winning-science-of-optogenetics"}, {"id": "F20261006-013", "title": "Trump’s recent statements on the economy are even more bonkers than usual | Steven Greenhouse", "summary": "Our ‘genius’ president is revealing his ignorance of economics, fueling concerns about the threat he poses to the world Donald Trump recently made a bold claim about his abilities, writing on Truth Social : “The only control or ‘guardrails’ that AI needs is a STRONG AND SMART (High IQ!) PRESIDENT, and the U.S.A. has that, in spades!” But in the days before and after that post, Trump made one mind-boggling statement after another, including one that raised the possibility of cutting off all trade with dozens of the US’s trading partners. The president’s statements had many experts questioning n", "source": "The Guardian", "category": "科技", "date": "2026-10-06", "url": "https://www.theguardian.com/commentisfree/2026/oct/05/trump-us-economy-comments"}, {"id": "F20261006-014", "title": "‘I spat in Sean Connery’s face 16 times’: Ron Perlman on making The Name of the Rose", "summary": "‘When I couldn’t do the spitting scene, Sean took me aside and said: “Ron, if you don’t actually spit ur own adversary' in NYC hearing", "summary": "The leading AI labs facing intensifying scrutiny over their safety and security practices.", "source": "CNBC", "category": "科技", "date": "2026-10-06", "url": "https://www.cnbc.com/2026/10/05/anthropic-openai-google-meta-execs-testify-nyc-council-ai-hearing.html"}, {"id": "F20261006-028", "title": "Standard Chartered Says Hormuz Oil Flows Are Far From Normal", "summary": "Oil flows through the Middle East have staged an impressive rebound, with export volumes recovering to near pre-war levels even as traffic through the Strait of Hormuz remains well below normal. Standard Chartered estimates crude and condensate exports from the Gulf, excluding Iran and including bypass routes such as Fujairah and the Red Sea, reached roughly 16.5 million barrels per day (bpd) in September, broadly back to pre-war volumes. But only 60% of those barrels crossed the Strait of Hormuz, compared with 83% before the war. Standard Chartered…", "source": "OilPrice", "category": "科技", "date": "2026-10-06", "url": "https://oilprice.com/Energy/Crude-Oil/Standard-Chartered-Says-Hormuz-Oil-Flows-Are-Far-From-Normal.html"}, {"id": "F20261006-039", "title": "Lucid Motors’ EV output falls to lowest level in almost 2 years", "summary": "The company is deliberately limiting production after years of struggling to find mass-market demand for its EVs.", "source": "TechCrunch", "category": "科技", "date": "2026-10-06", "url": "https://techcrunch.com/2026/10/05/lucid-motors-ev-output-falls-to-lowest-level-in-almost-two-years/"}, {"id": "F20261006-040", "title": "OpenAI will start watermarking ChatGPT’s text in the EU", "summary": "OpenAI will watermark ChatGPT and Codex text in the EU to comply with the AI Act. Editing can make the invisible marks harder to detect, it says.", "source": "TechCrunch", "category": "科技", "date": "2026-10-06", "url": "https://techcrunch.com/2026/10/05/openai-will-start-watermarking-chatgpts-text-in-the-eu/"}, {"id": "F20261006-024", "title": "‘People in the U.S. need to wake up’: As a mortgage loan officer, I rejected wealthy couples due to overspending. We’re all heading for trouble.", "summary": "A reader writes: “We’d better get real quick or we’re going to have a financial crisis that makes the Great Recession of 2008 look like a picnic.”", "source": "MarketWatch", "category": "金融", "date": "2026-10-06", "url": "https://www.marketwatch.com/story/people-in-the-u-s-need-to-wake-up-as-a-mortgage-loan-officer-i-rejected-wealthy-couples-due-to-overspending-were-all-heading-for-trouble-6a52e04e?mod=mw_rss_topstories"}, {"id": "F20261006-016", "title": "Inference for Regression with Clustered or Spatially Correlated Data I: Framework and Clustering -- by A. Colin Cameron, Douglas L. Miller", "summary": "Many regression analyses use observations that are correlated within uncorrelated clusters and/or are correlated in distance or other spatial measure. Such data are often positively correlated. This reduces the information content of an additional observation compared to the default of independent observations. Consequently, failure to adjust standard errors for such correlation leads to confidence intervals that are too narrow, and to hypothesis tests that over reject. In this paper we first provide a general framework. We then focus on inference when observations are correlated within cluste", "source": "NBER", "category": "科技", "date": "2026-10-06", "url": "https://www.nber.org/papers/w35800#fromrss"}, {"id": "F20261006-017", "title": "Inference for Regression with Clustered or Spatially Correlated Data II: Spatial Correlation -- by A. Colin Cameron, Douglas L. Miller", "summary": "This article presents inference for regression with data that are correlated across some measure of distance; most often geographic distance. Failure to appropriately adjust standard errors can lead to confidence intervals that are too narrow, and hypothesis tests that over-reject. If spatial correlation exists within region but not across regions then one can use cluster-robust inference methods presented in the companion paper, Cameron and Miller (2026). In this paper we focus on methods when spatial correlation is dampening in distance. Then the standard inference method is the spatial HAC ", "source": "NBER", "category": "科技", "date": "2026-10-06", "url": "https://www.nber.org/papers/w35801#fromrss"}, {"id": "F20261006-025", "title": "‘The pain was excruciating’: A friend in her 80s fell down her basement stairs. Could it have been avoided?", "summary": "“She developed pleural effusion — fluid between the lungs and ribs — compressing her lungs and making it hard for her to breathe.”", "source": "MarketWatch", "category": "科技", "date": "2026-10-06", "url": "https://www.marketwatch.com/story/the-pain-was-excruciating-a-friend-in-her-80s-fell-down-her-basement-stairs-could-it-have-been-avoided-ce105db6?mod=mw_rss_topstories"}, {"id": "F20261006-045", "title": "Gemini Call for Me might tell your mom you&#8217;re running late", "summary": "Google may be expanding its \"Call for Me\" AI feature beyond business calls so you can use it to send messages to friends and family. Android Authority reports finding a \"Gemini Calling\" introductory screen in an APK teardown with examples that include \"Call Mom and tell her I will be 15 minutes late\" and \"Call […]", "source": "The Verge", "category": "科技", "date": "2026-10-06", "url": "https://www.theverge.com/ai-artificial-intelligence/1005177/google-gemini-call-for-me-expansion-rumors"}, {"id": "F20261006-046", "title": "Reverse-engineered games: All the news on video game decomps, recomps, VR and web and 3D ports", "summary": "It’s a wild time for retro gaming. Thanks to decompilations and recompilations of classic titles, those games are becoming unshackled from their proprietary code and original hardware to be ported to new devices or updated in ways to completely change the original game. Ever imagined skateboarding in Call of Du 须自主制定自身的商品价格。” 麦当劳在周一发布了一份声明，表示相关指控属于主观揣测，缺乏事实依据。 “巨无霸汉堡以及其他任何餐品的价格都并非由人工智能设定。”该公司表示。麦当劳称，各特许加盟商拥有定价决策权；定价推荐工具以及数据分析手段在各行各业都已经得到普遍使用。 近些年来，美国已经出现多起集体诉讼。原告纷纷指控各类企业利用算法或者人工智能，就酒店客房、公寓租赁以及其他消费品类开展非法价格协同。 原告代理律师拉克 · 特纳（Lark Turner）在一份声明中表示，麦当劳“正在利用手里海量的数据以及特许加盟体系，从消费者身上一分一厘地榨取利益，就连最后一份薯条都不放过。” 诉状显示，原告是伊利诺伊州居民，", "source": "IT之家", "category": "科技", "date": "2026-10-06", "url": "https://www.ithome.com/1/009/924.htm"}, {"id": "F20261006-051", "title": "科学家识别出三种叫声最响亮的鸟", "summary": "生物学家在巴西识别出三种叫声最响亮的鸟。至于这些鸟如何演化出最响亮的叫声则仍然是个迷。白钟雀（white bellbird）叫声能达到 125 分贝，裸喉钟雀（bare-throated bellbird）和红腿叫鹤（red-legged seriema）叫声都超过 120 分贝。三种鸟类有着共同的生理特征：即宽大的喙口和肌肉厚实的大块头身体。研究人员表示，120 分贝可能是鸟类发声的生理极限；巴西之外的地方无疑也存在叫声洪亮的鸟类，但其音量不太可能比这些鸟高出太多。根据精确的测量标准，这三种鸟都可以被视为叫声最响亮者。但对科学家而言，谁是赢家并不是重点。", "source": "Solidot", "category": "科技", "date": "2026-10-06", "url": "https://www.solidot.org/story?sid=85539"}, {"id": "F20261006-052", "title": "因涌入大量 AI 报告 Google 冻结其 Bug 悬赏计划", "summary": "因涌入大量无效的 AI bug 报告，Google 宣布冻结其 Bug 悬赏计划 Open Source Software Vulnerability Reward Program (OSS VRP)，该决定于 10 月 1 日生效。Google 承诺将于 2027 年第一季度提供相关更新，期间将对该项目进行调整。Google 鼓励参与者探索其它 bug 奖励计划。大模型以及 Bug 搜寻自动化脚本的流行，导致了 OSS VRP 项目涌入了大量低质量的报告，Google 和开源项目维护者因此不堪重负，很多报告声称发现了 bug，但实际上无效，而维护者们浪费了大量时间去验证这些报告，无法专注于修复真正重要的 bug。整个行业都存在相同的问题。", "source": "Solidot", "category": "科技", "date": "2026-10-06", "url": "https://www.solidot.org/story?sid=85538"}, {"id": "F20261006-053", "title": "Has the Pentagon given up on AI polygraph analysis of trustworthiness?", "summary": "AI-aided scanning of speech patterns, vocal stress or facial expressions to read minds lacks scientific backing and will compound errors, critics argue.", "source": "C4ISRNet", "category": "科技", "date": "2026-10-06", "url": "https://www.c4isrnet.com/news/pentagon-congress/2026/10/05/has-the-pentagon-given-up-on-ai-polygraph-analysis-of-trustworthiness/"}, {"id": "F20261006-054", "title": "Germany to set up first drone regiment next year, modeled after Ukraine war lessons", "summary": "Germany plans to stand up its first dedicated drone regiment next year, Defense Minister Boris Pistorius has announced.", "source": "C4ISRNet", "category": "科技", "date": "2026-10-06", "url": "https://www.c4isrnet.com/global/europe/2026/10/05/germany-to-set-up-first-drone-regiment-next-year-modeled-after-ukraine-war-lessons/"}, {"id": "F20261006-055", "title": "Certainty is a Luxury Ukrainians Must Create", "summary": "Welcome to The Ukraine Compass, a weekly digest of Ukrainian commentary and analysis from across the political spectrum only for War on the Rocks members. Each week, we bring you a curated selection of articles from Ukrainian media offering insight into how Ukrainians themselves debate the issues shaping their country.Western coverage often narrows the view to the battlefield — these pieces widen it, revealing the texture of daily life, politics, and public argument in a nation at war. The perspectives gathered here are varied, candid, and often surprising, together forming a more complete pic", "source": "War on the Rocks", "category": "科技", "date": "2026-10-06", "url": "https://warontherocks.com/certainty-is-a-luxury-ukrainians-must-create/"}, {"id": "F20261006-026", "title": "Polar Capital Technology Trust plc (PLCQF) Shareholder/Analyst Call Transcript", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-06", "url": "https://seekingalpha.com/article/4952024-polar-capital-technology-trust-plc-plcqf-shareholder-analyst-call-transcript?source=feed_all_articles"}, {"id": "F20261006-027", "title": "Monte Rosa Therapeutics, Inc. (GLUE) Discusses GFORCE-1 Phase I Results for NEK7 Molecular Glue Degrader MRT-8102 in Cardiovascular Disease Risk - Slideshow", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-06", "url": "https://seekingalpha.com/article/4952091-monte-rosa-therapeutics-inc-glue-discusses-gforceminus-1-phase-i-results-for-nek7-molecular?source=feed_all_articles"}, {"id": "F20261006-001", "title": "Trump says 'threat' led US to pull bombers from RAF Fairford", "summary": "The Pentagon confirmed on Sunday it had removed the B1 bombers from the base in England back to their home stations in America.", "source": "BBC World", "category": "科技", "date": "2026-10-06", "url": "https://www.bbc.co.uk/news/articles/cwj3413e5m1lo?at_medium=RSS&at_campaign=rss"}, {"id": "F20261006-003", "title": "Flydubai co-pilot planned to crash plane into Tel Aviv airport or building, reports say", "summary": "The Omani national was a \"lone wolf\" extremist, according to the reports.", "source": "BBC World", "category": "科技", "date": "2026-10-06", "url": "https://www.bbc.co.uk/news/articles/cm3691y79xp5o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261006-030", "title": "MintFlow: Minimal Trajectory Intervention for Constrained Flow Matching", "summary": "arXiv:2610.02260v1 Announce Type: new Abstract: Flow matching models excel at generative modeling, and many downstream applications require their samples to satisfy prescribed constraints, such as observed measurements and physical laws. However, existing constrained samplers often face a trade-off: \\textit{enforcing constraints can substantially displace samples from the pretrained data distribution}. To address this trade-off, we introduce \\textbf{MintFlow}, a training-free constrained sampling framework that formulates constraint enforcement as a minimal intervention on the pretrained flow ", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-06", "url": "https://arxiv.org/abs/2610.02260"}, {"id": "F20261006-031", "title": "Fast Models, Slow Evidence: A Paired and Self-Audited Evaluation of System-1 Decision Models for LLM Agent Harnesses", "summary": "arXiv:2610.02267v1 Announce Type: new Abstract: Agent harnesses make many small, typed decisions per task: which model to call, which tool to use, whether retrieved text is relevant, whether an input carries an injection. System-1 decision models answer such questions in a single forward pass with class probabilities, promising large cost and latency savings over LLM calls. We present a paired evaluation of an open-weight (Laya) and a hosted (Jev) System-1 model on 11 agent decision points built from 18 public sources: 7,283 base cases plus 6,640 robustness variants, with byte-identical inputs", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-06", "url": "https://arxiv.org/abs/2610.02267"}, {"id": "F20261006-032", "title": "The AI Risk Observatory: What Can We Learn from AI Disclosures in Annual Reports About Societal Resilience?", "summary": "arXiv:2610.02281v1 Announce Type: new Abstract: Societal resilience research relies on access to useful and actionable data, which motivates our main research question: Can annual reports, processed at scale with LLMs, provide a useful signal about how companies disclose their response to AI? We test this by applying a reproducible two-stage classification pipeline to 9,821 annual reports from 1,362 UK listed companies (2020-2025, with partial 2026 data). We first validate the method against 474 human-annotated passages, finding high recall and moderate label-level agreement. We then report th", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-06", "url": "https://arxiv.org/abs/2610.02281"}, {"id": "F20261006-035", "title": "Don't miss: Watch Saturn shine and Halley’s Comet debris streak across the sky", "summary": "October skywatchers can see Saturn at opposition, catch meteors from Halley’s Comet during the Orionid peak, and watch the Moon sweep past the famous Pleiades star cluster. Moonlight may obscure some Orionids, but the best viewing should come before dawn after the Moon sets.", "source": "ScienceDaily", "category": "科技", "date": "2026-10-06", "url": "https://www.sciencedaily.com/releases/2026/10/261005071523.htm"}, {"id": "F20261006-036", "title": "Scientists reveal what seven days of fasting does to the human body", "summary": "Scientists found that .theverge.com/report/1005859/microsoft-xbox-gta-6-streaming-rights"}, {"id": "F20261007-044", "title": "Sharing AI Progress in Mathematics", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-07", "url": "https://openai.com/index/sharing-ai-progress-in-mathematics/"}, {"id": "F20261007-045", "title": "OpenAI just dropped 700 preprints of mathematical proofs and counterexamples", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-07", "url": "https://github.com/openai/math/tree/main/preprints"}, {"id": "F20261007-046", "title": "AI 颠覆担忧消退，美国软件股创 2026 年阶段新高", "summary": "IT之家 10 月 7 日消息，据路透社报道，受盈利预期大幅上调的推动，美国软件类股票正创出 2026 年阶段新高；多位分析师据此认为，此前市场对于人工智能将颠覆整个软件行业的担忧很大程度上被夸大了。 IT之家注意到，标普 500 软件与服务指数周二上涨 1.3%，创下自 2025 年 11 月以来的最高点位。在此之前，该指数在 7‑9 月这个季度录得自 2020 年第二季度之后最大的季度涨幅。 赛富时（Salesforce）、ServiceNow、埃森哲（Accenture）等软件企业交出亮眼的财报业绩，再加上各家企业与 AI 实验室达成各类合作，助推板块自六月下旬开启一轮复苏行情。 网络安全板块个股表现尤为突出。Crowdstrike、Fortinet 以及 Palo Alto Networks 今年的股价涨幅都达到了三位数百分比；进入 AI 时代之后，各家企业持续在网络安全领域投入重金。 LPL 金融首席跨资产策略师亚当 · 特伦奎斯特（Adam Turnquist）表示：“对于很多软件公司而言，人工智能更多起到赋能作用，而并非颠覆者。我们如今正在见证一轮趋势转向：软件板块重新夺回市场领涨地位。我们认为接下来一段时间，软件板块存在跑赢半导体板块的机会。” 软件板块指数今年累计上涨 5%；而费城半导体指数汇集了众多美国芯片厂商，2026 年涨幅高达 87.5%，不过该指数目前距", "source": "IT之家", "category": "科技", "date": "2026-10-07", "url": "https://www.ithome.com/1/010/141.htm"}, {"id": "F20261007-047", "title": "微软回应称考虑将 WinXP 经典游戏《三维弹球》带回 Win11", "summary": "IT之家 10 月 7 日消息，科技媒体 Windows Latest 昨日（10 月 6 日）发布博文，报道称微软 Windows 负责人帕万 · 达武鲁里（Pavan Davuluri）表示， Windows XP 经典游戏《三维弹球》已被纳入微软的“待办事项清单”。 在《Inside Windows》播客节目中，收录了来自一位用户在 X 平台发出的“让 3D 弹球游戏回归”提议，达武鲁里在节目中回应表示：“这是一个非常好的建议”。 IT之家翻译其回应内容如下： 用户喜欢游戏和 Windows 系统，而我们在 Windows 平台上拥有非常丰富的游戏库，涵盖休闲游戏到 3A 大作，可谓是应有尽有。 Windows 系统一直以来都有预装游戏的良好记录，而且我们已收到关于 3D 弹珠游戏的诸多建议，我们会将其纳入考虑范围。 不过达武鲁里的表态，并没有直接回应微软已启动开发，也没有确认游戏未来会预装整合到 Windows 11 系统中。 《3D 弹球》最后一次随 Windows 系统提供是在 Windows XP 时代。微软此前解释称，团队将 Windows XP 移植到 64 位系统时， 发现弹珠会穿过场景物体，游戏因此出现兼容性问题 。 相关阅读： 《 微软谈老 Windows 自带游戏〈三维弹球〉为何删了：我们没法花好几天研究代码 》 《 记得 Windows XP 里的弹球游", "source": "IT之家", "category": "科技", "date": "2026-10-07", "url": "https://www.ithome.com/1/010/140.htm"}, {"id": "F20261007-049", "title": "Kindling, Catalyst, and Containment: Will the West Bank Ignite?", "summary": "As violence by Israeli settlers against Palestinians in the West Bank has escalated, often with the acquiescence or support of Israel’s military, and the Israeli government has increasingly constricted Palestinian daily life, the potential for a new intifada — or uprising — has intensified. The first Palestinian intifada began in late 1987 and continued for several years. Civil society played a major role in organizing the first intifada, which started as mostly nonviolent and included economic measures such as strikes and boycotts. The second intifada broke out in 2000 and lasted into 2005. I", "source": "War on the Rocks", "category": "科技", "date": "2026-10-07", "url": "https://warontherocks.com/kindling-catalyst-and-containment-will-the-west-bank-ignite/"}, {"id": "F20261007-026", "title": "Progressive Planet Solutions Inc. (PLAN:CA) Discusses Record Q1 Results, Financial Position, and Progress on Major Capital Projects Transcript", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-07", "url": "https://seekingalpha.com/article/4952362-progressive-planet-solutions-inc-plan-ca-discusses-record-q1-results-financial-position-and?source=feed_all_articles"}, {"id": "F20261007-027", "title": "Zscaler, Inc. (ZS) Analyst/Investor Day Transcript", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-07", "url": "https://seekingalpha.com/article/4952312-zscaler-inc-zs-analyst-investor-day-transcript?source=feed_all_articles"}, {"id": "F20261007-001", "title": "US death row inmate Christa Pike awake and speaking after failed execution, lawyers say", "summary": "Experts and lawyers called the apparent recovery unprecedented, noting she is believed to be the only known person to rce": "BBC World", "category": "科技", "date": "2026-10-08", "url": "https://www.bbc.co.uk/news/articles/c5zjx7xx3487o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261008-030", "title": "GAMEGO: Training Game-Dev Agents with Synthetic Trajectories Anchored in Real-World Assets", "summary": "arXiv:2610.06910v1 Announce Type: new Abstract: Recent advances in Large Language Models (LLMs) have demonstrated remarkable capabilities in web front-end execution, with browser-based game generation emerging as a particularly prominent frontier. While previous efforts frequently rely on complex multi-turn workflows or focus on static game evaluation benchmarks, this work targets direct end-to-end real-world game synthesis driven by coding agents. However, generating complex games directly from sparse user queries often forces coding agents to make underspecified assumptions, yielding incompl", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-08", "url": "https://arxiv.org/abs/2610.06910"}, {"id": "F20261008-031", "title": "Text2Dashboard: A Governed Agent Architecture for Natural-Language Dashboard Generation over Enterprise DataBrain", "summary": "arXiv:2610.06914v1 Announce Type: new Abstract: Text2Dashboard is a DataBrain-specific prototype that turns natural-language analytic requests into inspectable dashboards. An installable Codex plugin and standalone Agent Runtime combine schema-constrained model decisions with typed tools, persistent state, and deterministic Hooks for approval, audit, checkpointing, recovery, and failure handling. The pipeline resolves entities, discovers metadata, enforces read-only SQL, composes dashboards, and applies static checks, dynamic preflight, and browser inspection. The model proposes actions while ", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-08", "url": "https://arxiv.org/abs/2610.06914"}, {"id": "F20261008-032", "title": "FluidPD: In-Place Elasticity for SLO-Aware Prefill-Decode Disaggregated LLM Serving", "summary": "arXiv:2610.06917v1 Announce Type: new Abstract: Prefill-decode disaggregation is becoming a common architecture for LLM serving because it separates two phases with distinct execution patterns and SLO objectives. Existing systems typically combine a fixed prefill/decode worker ratio with request routing across workers. However, real-world workloads exhibit both short bursts and sustained shifts in the prefill-to-decode demand ratio. As a result, a configuration that is well provisioned at one time may quickly become mismatched, causing latency SLO violations even when idle capacity exists else", "source": "arXiv cs.AI", "category": "科技", "date": "2026-10-08", "url": "https://arxiv.org/abs/2610.06917"}, {"id": "F20261008-033", "title": "NASA’s Webb finds signs of Mars-sized worlds smashing together", "summary": "NASA’s James Webb Space Telescope is giving astronomers a glimpse of the kinds of violent collisions that may have shaped our own solar system, including the giant impact thought to have created the Moon. By studying 21 rare “extreme debris disks” around young stars, researchers found that their dust can reveal the scale and intensity of planetary collisions.", "source": "ScienceDaily", "category": "科技", "date": "2026-10-08", "url": "https://www.sciencedaily.com/releases/2026/10/261007042108.htm"}, {"id": "F20261008-034", "title": "Taking antibiotics? Sugar may be making the damage worse", "summary": "Eating more sugar while taking antibiotics was linked to greater disruption of the gut microbiome and increased growth of potentially harmful bacteria. Researchers say temporarily cutting back on sweets during and after antibiotic treatment could be a simple way to reduce this damage, though clinical trials are still needed.", "source": "ScienceDaily", "category": "科技", "date": "2026-10-08", "url": "https://www.sciencedaily.com/releases/2026/10/261007042059.htm"}, {"id": "F20261008-042", "title": "“Software is over”: Bold AI developer takes aim at Adobe w ry": "“IT早报”时间，大家好，现在是 2026 年 10 月 9 日星期五，今天的重要科技资讯有： 1. 苹果官宣“欢迎回家”发布会定档 10 月 13 日，暗示首款智能家居中枢产品 苹果营销高级副总裁 Greg Joswiak 发布预告，官宣“Welcome home（欢迎回家）”发布会定档美国东部时间 10 月 13 日上午 9 点（北京时间 10 月 13 日晚 9 点）。>> 查看详情 2. 尊界回应制动踏板支架底座相关问题：制动系统按高于国家 / 行业标准开发验证，提供免费升级选择 尊界汽车官方 10 月 8 日发布了关于尊界汽车制动踏板支架底座相关问题的情况说明。官方表示，尊界汽车的制动系统，按照高于国家标准（GB 21670‑2025 / GB 7258‑2026）、高于行业标准（QC/T 788‑2018）的要求完成全流程开发与验证。自首批车辆交付以来，在用户实际使用场景中，未发生制动踏板支架底座断裂故障。>> 查看详情 3. 7999 元起，小米 17 Ultra 手机全系涨价 1000 元 据博主 @怕不是小小白 ，10 月 9 日起小米 17 Ultra 手机全系涨价 1000 元。>> 查看详情 4. 小米澎程首销月锁单进展公布：上市 30 天，锁单已超过 7 万台 小米汽车 10 月 8 日汇报了小米澎程首销月锁单进展：9 月 7 日 ~10 月 7 日，上市", "source": "IT之家", "category": "农业", "date": "2026-10-09", "url": "https://www.ithome.com/1/010/766.htm"}, {"id": "F20261009-009", "title": "US to livestream Fort Hood shooter's execution: Pentagon", "summary": "US Pentagon chief Pete Hegseth had said that Nidal Hasan would be executed by firing squad and that it would be done \"in public.\" Hasan's execution will be the first by the US military since 1961.", "source": "DW", "category": "科技", "date": "2026-10-09", "url": "https://www.dw.com/en/us-to-livestream-fort-hood-shooter-s-execution-pentagon/a-79606395?maca=en-rss-en-all-1573-rdf"}, {"id": "F20261009-010", "title": "Man injured after New York shooting involving DHS agents", "summary": "The shooting happened in the afternoon in the Bronx, with details still emerging. The incident involved the US Department of Homeland Security, the parent agency of US Immigration and Customs Enforcement (ICE).", "source": "DW", "category": "科技", "date": "2026-10-09", "url": "https://www.dw.com/en/man-injured-after-new-york-shooting-involving-dhs-agents/a-79606159?maca=en-rss-en-all-1573-rdf"}, {"id": "F20261009-011", "title": "US files new torture charges against  Venezuela's Nicolas Maduro and wife Cilia Flores", "summary": "The United States on Thursday charged ousted Venezuelan president Nicolas Maduro and his wife Cilia Flores with conspiracy to commit torture, adding to drug trafficking and firearms charges. Prosecutors allege detainees, including US citizens, suffered waterboarding, rape and beatings. The pair remain in US custody following a January military raid.", "source": "France 24", "category": "科技", "date": "2026-10-09", "url": "https://www.france24.com/en/americas/20261008-us-files-new-torture-charges-venezuela-nicolas-maduro-cilia-flores"}, {"id": "F20261009-012", "title": "OpenAI bans Russian, Iranian ChatGPT propaganda networks", "summary": "OpenAI said Thursday it shut down Russian and Iranian influence operations that used ChatGPT to create fake journalist personas and support a purported think tank spreading anti-Ukraine propaganda. The Iranian operation involved seven profiles posing as Western journalists to place lengthy articles in media outlets worldwide, the AI company said.", "source": "France 24", "category": "科技", "date": "2026-10-09", "url": "https://www.france24.com/en/technology/20261008-openai-bans-russian-iranian-chatgpt-propaganda-networks"}, {"id": "F20261009-014", "title": "An AI boom is sending San Francisco rents through the roof: ‘Nowhere left for people to go’", "summary": "According to city’s rent board, eviction notices are up 44% and tenants are on edge over landlords swooping in over their homes To say that Maria Zamudio and her team have been busy lately would be a gross understatement. Every Monday at 9am, the phone lines at the downtown clinic of San Francisco’s Housing Rights Committee start ringing, and they keep ringing until closing at 5pm. In-person counseling appointments for renters facing eviction or landlord misconduct fill days in advance. After every weekend, the staff of seven sits in their office and sifts through more than 150 voicemails. The", "source": "The Guardian", "category": "科技", "date": "2026-10-09", "url": "https://www.theguardian.com/us-news/ng-interactive/2026/oct/08/san-francisco-housing-ai-boom"}, {"id": "F20261009-022", "title": "Nvidia, Oracle, CoreWeave and other AI stocks sink on OpenAI revenue report", "summary": "OpenAI has told investors that it hit roughly $50 billion in annualized revenue at the end of September, CNBC confirmed.", "source": "CNBC", "category": "科技", "date": "2026-10-09", "url": "https://www.cnbc.com/2026/10/08/open-ai-revenue-nvidia-oracle-coreweave.html"}, {"id": "F20261009-029", "title": "World’s Top Crude Trader Isn’t Ruling Out $200 Oil Just Yet", "summary": "Ship-to-ship transfers in the Gulf of Oman that keep oil flowing from the Middle East provide a lifeline to Gulf producers and to the oil market, according to Russell Hardy, chief executive officer at the world’s biggest independent oil trader, Vitol Group. “Without it, you do have that $200-a-barrel scenario, so it is pretty important it continues,” Hardy said at the Energy Intelligence Forum in London this week. “There aren’t any more inventories to drain in the West.” The ship-to-ship (STS) transfers, in which…", "source": "OilPrice", "category": "科技", "date": "2026-10-09", "url": "https://oilprice.com/Energy/Oil-Prices/Worlds-Top-Crude-Trader-Isnt-Ruling-Out-200-Oil-Just-Yet.html"}, {"id": "F20261009-040", "title": "The model that didn't exist, so you made it yourself", "summary": "", "source": "Hugging Face", "category": "科技", "date": "2026-10-09", "url": "https://huggingface.co/blog/building-with-ml-intern"}, {"id": "F20261009-041", "title": "President Trump awards Big Tech donors with nation’s highest science prizes", "summary": "Together, the awardees have donated nearly $6 billion to efforts tied to Trump and his administration.", "source": "TechCrunch", "category": "科技", "date": "2026-10-09", "url": "https://techcrunch.com/2026/10/08/president-trump-awards-big-tech-donors-with-nations-highest-science-prizes/"}, {"id": "F20261009-042", "title": "Pretend you’re sitting at Elizabeth Holmes’ desk on this weirdly detailed website", "summary": "With over a thousand emails, slides, texts, and documents from the United States v. Elizabeth Holmes trial, Extend engineer Bo Lau created a website that simulates what it might have been like to rifle through the Theranos founder's desk.", "source": "TechCrunch", "category": "科技", "date": "2026-10-09", "url": "https://techcrunch.com/2026/10/08/pretend-youre-sitting-at-elizabeth-holmes-desk-on-this-weirdly-detailed-website/"}, {"id": "F20261009-024", "title": "Feel like a pumpkin-spice burrito? Analysts try to wrap their heads around a possible Starbucks-Chipotle tie-up.", "summary": "Starbucks investors would likely not be happy about the company adding debt to finance a deal to buy Chipotle, given that it already has a high debt load.", "source": "MarketWatch", "category": "金融", "date": "2026-10-09", "url": "https://www.marketwatch.com/story/feel-like-a-pumpkin-spice-burrito-analysts-try-to-wrap-their-heads-around-a-possible-starbucks-chipotle-tie-up-5b8519fd?mod=mw_rss_topstories"}, {"id": "F20261009-025", "title": "Micron, Nvidia and AI chip stocks fall as report on OpenAI’s revenue causes ‘undue concern’", "summary": "OpenAI’s annualized revenue reportedly fell short of expectations — but analysts say that reflects differences in how the figure is reported, not weakness in AI demand.", "source": "MarketWatch", "category": "科技", "date": "2026-10-09", "url": "https://www.marketwatch.com/story/micron-nvidia-and-ai-chip-stocks-fall-as-report-on-openais-revenue-causes-undue-concern-2a2bcf53?mod=mw_rss_topstories"}, {"id": "F20261009-047", "title": "US plans livestream of execution by firing squad", "summary": "The United States' execution of the Fort Hood shooter will be livestreamed, anonymous officials from the Defense Department told the BBC and Associated Press. The planned execution of Nidal Hasan, the former US Army major convicted of killing 13 people at the Texas military base, was announced this week. He is scheduled to be executed […]", "source": "The Verge", "category": "科技", "date": "2026-10-09", "url": "https://www.theverge.com/tech/1008530/us-government-livestream-execution-firing-squad-fort-hood"}, {"id": "F20261009-048", "title": "Anthropic launches free AI security scans for open-source projects", "summary": "Anthropic's offering to help open-source projects track down security vulnerabilities with a new service called OSS Scanner. It says open-source projects that opt-in will get \"thorough, periodic security scans by our strongest models at no cost.\" That could mean open-source projects get alerted about possible security issues sooner, but the trade-off is that OSS Scanner's […]", "source": "The Verge", "category": "科技", "date": "2026-10-09", "url": "https://www.theverge.com/ai-artificial-intelligence/1008521/anthropic-open-source-oss-scanner"}, {"id": "F20261009-049", "title": "Whistle: Speech to Text in 16.9 MB", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-09", "url": "https://cactuscompute.com/blog/whistle"}, {"id": "F20261009-050", "title": "Theranos.world", "summary": "Comments", "source": "Hacker News", "category": "科技", "date": "2026-10-09", "url": "https://www.theranos.world/"}, {"id": "F20261009-051", "title": "苹果库克解释为何赶在 iPhone Duo 发布前交接：为特努斯创造有利开局", "summary": "IT之家 10 月 9 日消息，本周三在接受《独立报》记者大卫 · 费兰（David Phelan）采访时，苹果前首席执行官蒂姆 · 库克（Tim Cook）表示，他于 9 月 1 日卸任 CEO， 部分原因是在 iPhone Duo 发布前 8 天，为继任者约翰 · 特努斯（John Ternus）创造有利开局。 库克表示，这次交接“数年前就已启动”。他说，苹果希望打造一次可供后人借鉴的“教科书式”交接，并称整个过程基本符合其预期。 IT之家翻译库克采访内容如下： 这是一次有趣的转型。我们一开始就立志要打造史上最佳转型，一个可供后人借鉴学习的教科书式范例。实际上，这项工作早在几年前就开始了。 显然，这些事情并非一蹴而就，但我对目前的进展感到非常满意。我认为一切都几乎完全按照我的设想进行。这种感觉棒极了。因为苹果值得拥有最好的。 特努斯此前担任苹果硬件工程主管，并于 9 月 1 日接替库克出任 CEO。库克称，他对交接进展感到满意，并认为苹果值得拥有最好的领导者。 库克还透露，他向特努斯提出与乔布斯当年给他的类似建议：不要模仿前任。他表示，领导者应把时间投入最能创造价值的领域，并按自身优势开展工作。", "source": "IT之家", "category": "科技", "date": "2026-10-09", "url": "https://www.ithome.com/1/010/767.htm"}, {"id": "F20261009-053", "title": "Manus 成功融资逾 5 亿美元", "summary": "经历收购风波的中国 AI 企业 Manus 完成超过 5 亿美元融资，创始人肖弘也已解除边控，让这家一度卷入中美科技博弈、前途未卜的公司迎来“重启”，也彰显了中国资本市场对 AI 的热情。 Manus 的母公司蝴蝶效应，星期四（10月8日）在公众号宣布融资消息。这是中国 AI 应用领域迄今规模最大的单轮融资之一，由中国私募股权基金博裕资本和老牌美元基金 IDG 领投，老股东腾讯、红杉中国、真格基金跟投。 公司投后估值达到 40 亿美元，也让 Manus 成为中国估值最高的 AI 智能体初创企业。 去年 12 月 Meta 斥资 20 亿美元收购 Manus，但交易被中国监管部门要求撤回。", "source": "Solidot", "category": "科技", "date": "2026-10-09", "url": "https://www.solidot.org/story?sid=85554"}, {"id": "F20261009-054", "title": "北欧饮食与长寿相关", "summary": "众所周知，地中海饮食有利于健康长寿。现在研究人员报告另一种欧洲饮食——北欧饮食也与长寿相关。丹麦、芬兰、冰岛、挪威和瑞典等国的传统饮食与地中海饮食有很多相似之处，差不多是其寒冷版本，因此又名北方的地中海饮食。北欧饮食以植物为主，主要食用富含脂肪的鱼和根茎蔬菜。研究人员分析了于 64,000 名瑞典中老年人的健康数据，发现饮食习惯更符合北欧饮食的人的全因死亡率、心血管死亡率和癌症死亡率更低。", "source": "Solidot", "category": "科技", "date": "2026-10-09", "url": "https://www.solidot.org/story?sid=85553"}, {"id": "F20261009-026", "title": "Aritzia Inc. (ATZ:CA) Q2 2027 Earnings Call Transcript", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-09", "url": "https://seekingalpha.com/article/4952927-aritzia-inc-atz-ca-q2-2027-earnings-call-transcript?source=feed_all_articles"}, {"id": "F20261009-027", "title": "Intermap Technologies Corporation (IMP:CA) M&A Call Transcript", "summary": "", "source": "Seeking Alpha", "category": "金融", "date": "2026-10-09", "url": "https://seekingalpha.com/article/4952928-intermap-technologies-corporation-imp-ca-m-and-a-call-transcript?source=feed_all_articles"}, {"id": "F20261009-028", "title": "FAO Food Price Index rises in September amid weather concerns and transport disruptions", "summary": "FAO’s benchmark measure of world food commodity prices increased in September, due mostly to transportation disruptions and weather concerns that constrained availability as well as to higher quotations for crop-based commodity groups, according to new data released by the Food and Agriculture Organization of the United Nations (FAO).", "source": "MercoPress", "category": "农业", "date": "2026-10-09", "url": "https://en.mercopress.com/2026/10/08/fao-food-price-index-rises-in-september-amid-weather-concerns-and-transport-disruptions?utm_source=feed&utm_medium=rss&utm_content=agriculture&utm_campaign=rss"}, {"id": "F20261009-055", "title": "Ten Wartime Technologies at America’s 250th", "summary": "For America’s 250th anniversary, Cogs of War ran ten essays on innovations forged in wartime that subsequently diffused throughout the civilian economy, or had a lasting impact on society, governance, and Americans’ relationship with technology. We received submissions on a wide range of technologies, ranging from a copying lathe built for musket stocks after the War of 1812 to the stealth bomber. Over the last few weeks, subscribers to our free newsletter voted, and we’re pleased to announce the winners of our contest below.One idea surfaced in most of the essays: Historically, the government", "source": "War on the Rocks", "category": "军事", "date": "2026-10-09", "url": "https://warontherocks.com/cogs-of-war/ten-wartime-technologies-at-americas-250th/"}, {"id": "F20261009-001", "title": "Suspect linked to Monaco bomb attack on millionaire breaks silence to BBC", "summary": "Vitalii Zhykovych gives his own account of the attempted assassination of Ukrainian-born businessman Vadym Yermolayev.", "source": "BBC World", "category": "科技", "date": "2026-10-09", "url": "https://www.bbc.co.uk/news/articles/ckgel9044vqeo?at_medium=RSS&at_campaign=rss"}, {"id": "F20261009-002", "title": "Fort Hood attacker's execution by firing squad will be livestreamed, Pentagon says", "summary": "\"We'll make sure that people are able to watch it,\" the US Defence Secretary Pete Hegseth said on Thursday.", "source": "BBC World", "category": "科技", "date": "2026-10-09", "url": "https://www.bbc.co.uk/news/articles/cmy0r96xygx6o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261009-003", "title": "Russian strike on buses kills at least 30, say officials, as deadly attacks on Ukraine surge", "summary": "Ukraine accused Russia of targeting two crowded vehicles in the front line city of Kramatorsk to kill as many civilians as possible.", "source": "BBC World", "category": "科技", "date": "2026-10-09", "url": "https://www.bbc.co.uk/news/articles/c875pwq134l3o?at_medium=RSS&at_campaign=rss"}, {"id": "F20261009-018", "title": "The End of Gaza", "summary": "A failing peace process leads to only one outcome.", "source": "Foreign Affairs", "category": "科技", "date": "2026-10-09", "url": "https://www.foreignaffairs.com/palestinian-territories/end-gaza"}, {"id": "F20261009-036", "title": "NASA is searching for hidden caves to build its first Moon base", "summary": "NASA is preparing for humanity’s first Moon base with three investigations that will hunt for underground shelters, uncover hidden ice, and track dangerous conditions on the lunar surface. The findings could reveal how astronauts can survive and thrive on the Moon while laying the groundwork for future journeys to Mars.", "source": "ScienceDaily", "category": "科技", "date": "2026-10-09", "url": "https://www.sciencedaily.com/releases/2026/10/261008005247.htm"}, {"id": "F20261009-037", "title": "Scientists accidentally discover a genetic code that breaks the rules of life", "summary": "Scientists accidentally discovered a microscopic organism with a genetic code that breaks a rule researchers thought was nearly universal. While testing a new DNA sequencing technique, they examined a previously unknown protist collected from a freshwater pond at Oxford University. To their surprise, the organism uses two genetic signals that normally mark the end of a gene to encode two entirely different amino acids instead. These signals were previously thought to evolve together, making the discovery particularly remarkable.", "source": "ScienceDaily", "category": "科技", "date": "2026-10-09", "url": "https://www.sciencedaily.com/releases/2026/10/261007233136.htm"}, {"id": "F20261009-043", "title": "R.I.P. Margaret Hamilton, whose code saved the Apollo 11 Moon landing", "summary": "Hamilton also coined the term \"software engineering\" and founded two successful software companies.", "source": "Ars Technica",
